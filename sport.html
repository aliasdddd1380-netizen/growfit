<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051a">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>تست انتخاب رشتهٔ ورزشی | گروفیت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308051a'/%3E%3Cpath d='M32 10l22 12v20L32 54 10 42V22z' fill='none' stroke='%23a855f7' stroke-width='5'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Vazirmatn";font-weight:400;font-display:swap;src:local("Vazirmatn"),local("Vazirmatn Regular"),url("fonts/Vazirmatn-Regular.woff2") format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:700;font-display:swap;src:local("Vazirmatn Bold"),url("fonts/Vazirmatn-Bold.woff2") format("woff2")}
:root{--bg:#08051a;--s1:#120d2b;--s2:#1a1340;--s3:#271c57;--line:rgba(139,92,246,.24);--tx:#f6f3ff;--mut:#9d96bd;--or:#a855f7;--or2:#d8b4fe;--ice:#22d3ee;--amb:#fbbf24;--ok:#34d399;--err:#fb7185;--vio:#7c3aed;--pink:#e879f9;--grad:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);--grad2:linear-gradient(135deg,#22d3ee 0%,#34d399 100%);--glass:rgba(22,15,52,.72);--glow:0 10px 30px rgba(124,58,237,.28);--font:Vazirmatn,"IRANSansX","IRANSans","Shabnam","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:16px/1.8 var(--font);background:radial-gradient(1100px 560px at 90% -8%,rgba(124,58,237,.38),transparent 62%),radial-gradient(900px 520px at -10% 105%,rgba(79,70,229,.28),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
body{padding:env(safe-area-inset-top) 0 0}
main{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
header{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
header h1{font-size:21px;font-weight:800;line-height:1.4}
header p{color:var(--mut);font-size:13px}
.prog{display:flex;gap:6px;margin:14px 0 4px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--s3);transition:background .25s}
.prog i.on{background:var(--grad)}
.stepname{color:var(--mut);font-size:13px;margin:6px 0 14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px)}
.card h2{font-size:18px;margin-bottom:6px}
.f{margin-bottom:18px}.f:last-child{margin-bottom:0}
label.l{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
label.l small{color:var(--mut);font-weight:400;font-size:12.5px;display:block;margin-top:2px}
input[type=text],input[type=number],input[type=tel]{width:100%;background:var(--s2);color:var(--tx);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font:inherit;font-size:16px;outline:none;min-height:50px;direction:ltr;text-align:right}
input:focus{border-color:var(--or)}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{position:relative;flex:1 1 auto}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--s2);border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;font-size:14.5px;transition:.15s;min-height:46px;height:100%}
.opt input:checked+span{border-color:var(--or);background:rgba(168,85,247,.2);font-weight:700;box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.opt input:focus-visible+span{outline:2px solid var(--or);outline-offset:2px}
.opts.col .opt{flex:1 1 100%}
.opts.col .opt span{justify-content:flex-start;text-align:right}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt span{padding:10px 0;font-weight:700}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:6px}
.err{color:var(--err);font-size:13px;margin-top:6px}
.f.bad input[type=number],.f.bad .opt span{border-color:var(--err)}
.note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.38);color:#fde68a;border-radius:14px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.info{background:var(--s2);border-radius:14px;padding:11px 14px;font-size:13.5px;color:var(--mut);margin-bottom:14px}
.nav{position:fixed;inset-inline:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom));z-index:5}
.nav div{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:15px;padding:14px 16px;font:inherit;font-size:16px;font-weight:800;color:#fff;background:var(--s3);cursor:pointer;min-height:52px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.pri{background:var(--grad);box-shadow:var(--glow)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;min-height:42px;font-weight:700;flex:none}
.btn.back{flex:0 0 34%}
.hide{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{display:inline-block;padding:2px 11px;border-radius:99px;background:var(--s3);font-size:12.5px;color:var(--or2)}
.grp{margin-bottom:12px}
.grp b{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.pill .opt{flex:none}
.pill .opt span{padding:7px 12px;font-size:13.5px;min-height:38px;border-radius:99px}
/* result */
.hero{text-align:center;padding:10px 0 4px}
.hero h2{font-size:22px}
.hero p{color:var(--mut);font-size:14px;margin-top:4px}
.rc{position:relative;overflow:hidden}
.rc.top{border-color:rgba(168,85,247,.55);box-shadow:var(--glow)}
.rc .hd{display:flex;gap:14px;align-items:center}
.rc .rk{flex:none;width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.rc .ic{font-size:34px;line-height:1}
.rc .ti{flex:1;min-width:0}
.rc .ti b{display:block;font-size:18px;line-height:1.4}
.rc .ti span{color:var(--mut);font-size:12.5px}
.ring{flex:none;width:68px;height:68px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.lab{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:#0b0720;background:var(--grad2);border-radius:99px;padding:1px 12px}
ul.why{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
ul.why li{padding-inline-start:22px;position:relative;margin:4px 0}
ul.why li:before{content:"✓";position:absolute;inset-inline-start:0;color:var(--ok);font-weight:800}
ul.why.w li:before{content:"!";color:var(--amb)}
.sch{background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.sch b{color:var(--ice)}
.more{font-size:13.5px;color:var(--mut);margin-top:8px}
.more b{color:var(--tx)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .ic{font-size:24px}
.row .ti{flex:1;min-width:0;font-size:14.5px}
.row .ti small{display:block;color:var(--mut);font-size:12px}
.bar{height:6px;background:var(--s3);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.pct{flex:none;width:44px;text-align:center;font-weight:800}
.sel{flex:none}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--or2);font-weight:700;font-size:14px;padding:6px 0}
details p,details li{font-size:13.5px;color:var(--mut)}
details a{color:var(--ice)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--tx);color:#0b0720;border-radius:12px;padding:9px 18px;font-weight:700;font-size:14px;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media(min-width:900px){main{max-width:880px}.opt span{font-size:15px}.rc.top .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== GrowFit "Liquid Glass" =====
   Translucent, light-refracting surfaces: frosted blur + saturation boost, a bright specular edge, inner highlights,
   soft depth shadows, and a floating glass dock. Only appearance changes; layout, features and data are untouched.
   Fallbacks: no backdrop-filter, reduced transparency, higher contrast and low-end devices get calmer, more opaque glass. */
:root{
 --lg-tint:rgba(18,10,48,.42);
 --lg-blur:blur(20px) saturate(175%);
 --lg-edge:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.10) 26%,rgba(255,255,255,.03) 54%,rgba(255,255,255,.36));
 --lg-hi:inset 0 1px 0 rgba(255,255,255,.36),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 24px rgba(255,255,255,.035);
 --lg-shadow:0 12px 36px rgba(4,1,22,.52);
 --lg-btn:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
 --lg-pri:linear-gradient(180deg,#7c3aed 0%,#5b21b6 100%);
 --mut:#b9b2da;--line:rgba(255,255,255,.16);
}
html{background:#060316}
body{min-height:100vh;min-height:100dvh;background:
 radial-gradient(60vmax 60vmax at 92% -6%,rgba(139,92,246,.78),transparent 62%),
 radial-gradient(48vmax 48vmax at -8% 24%,rgba(34,211,238,.46),transparent 62%),
 radial-gradient(54vmax 54vmax at 78% 108%,rgba(232,121,249,.54),transparent 64%),
 radial-gradient(44vmax 44vmax at 4% 104%,rgba(59,130,246,.5),transparent 64%),
 radial-gradient(34vmax 34vmax at 52% 46%,rgba(99,102,241,.32),transparent 66%),#060316;
 background-attachment:fixed}
/* ---------- primary glass surfaces (blur) ---------- */
.card,.dcard,.dt,.wk,.ringcard,.tile,.d-sub,.rc{
 position:relative;border:1px solid transparent;
 background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 46%,rgba(124,82,255,.08)),var(--lg-tint);
 -webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
 box-shadow:var(--lg-hi),var(--lg-shadow)}
.card:before,.dcard:before,.dt:before,.wk:before,.ringcard:before,.tile:before,.d-sub:before,.rc:before,.bn:before,#side:before,.sheet>div:before,.d-hero:before,.d-ban:before{
 content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
 background:var(--lg-edge);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.d-hero,.d-ban{position:relative;border-color:transparent;-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-hi),var(--lg-shadow)}
.d-hero{background:linear-gradient(120deg,rgba(14,9,40,.5) 0%,rgba(76,40,180,.5) 58%,rgba(139,92,246,.46) 100%)}
.d-ban{background:linear-gradient(120deg,rgba(91,33,182,.62),rgba(20,12,52,.55))}
.rw{border:1px solid rgba(255,255,255,.14);background:rgba(10,6,32,.5);box-shadow:var(--lg-hi)}
.card.sk,.card.grp{border-right:4px solid var(--sp,var(--or))}
.sheet .card,.sheet .dcard{-webkit-backdrop-filter:none;backdrop-filter:none}
/* ---------- secondary glass (tint only, no nested blur) ---------- */
#app .opt,.sg,.fx,.macros div,.mac,.tipbox,.sprow{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn,.tb,.ic,.dlink,.qa,.opt span{
 background:var(--lg-btn);border:1px solid rgba(255,255,255,.2);color:var(--tx);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.04),0 4px 14px rgba(4,1,22,.3);
 transition:background .2s,box-shadow .2s,border-color .2s}
.btn:hover,.tb:hover,.ic:hover,.dlink:hover,.qa:hover{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.09));border-color:rgba(255,255,255,.32)}
.btn.pri,.tb.on,.rpe button.on,.ck.on,.d-cta,.d-ban .go2,.banner{
 background:var(--lg-pri);border-color:rgba(196,181,253,.55);color:#fff;
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -10px 18px rgba(30,6,90,.35),0 10px 28px rgba(124,58,237,.5)}
.banner{border:1px solid rgba(196,181,253,.5)}
.d-cta i{background:rgba(255,255,255,.92)}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#d9d2f4}
.chip.or{background:rgba(139,92,246,.3);border-color:rgba(196,181,253,.45);color:#efe9ff}
input,select,textarea{background:rgba(6,3,24,.42);border:1px solid rgba(255,255,255,.18);color:var(--tx);
 box-shadow:inset 0 2px 8px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.07)}
input:focus,select:focus,textarea:focus{border-color:rgba(103,232,249,.85);box-shadow:inset 0 2px 8px rgba(0,0,0,.4),0 0 0 3px rgba(34,211,238,.32);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #67e8f9;outline-offset:2px}
.opt input:checked+span{background:linear-gradient(180deg,rgba(139,92,246,.62),rgba(91,33,182,.55));border-color:rgba(196,181,253,.7);color:#fff;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(124,58,237,.4)}
.opt input:focus-visible+span{outline:3px solid #67e8f9;outline-offset:2px}
.bar,.prog i{background:rgba(255,255,255,.12);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.prog i.on{background:var(--lg-pri);box-shadow:0 0 12px rgba(124,58,237,.6)}
.sw i{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+i{background:var(--lg-pri)}
.kv,.mac div{border-color:rgba(255,255,255,.12)}
.note{background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.45);color:#fde68a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.info{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--mut)}
/* ---------- floating glass dock ---------- */
.bn{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:32px;padding:8px;
 background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 55%),rgba(20,12,52,.5);
 -webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
 border:1px solid transparent;box-shadow:var(--lg-hi),0 20px 54px rgba(3,1,20,.62)}
.bn>button{border-radius:22px;transition:background .2s,color .2s}
.bn>button.on{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);color:#fff}
.bn .fab{background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.6),transparent 46%),linear-gradient(160deg,#8b5cf6,#5b21b6);
 border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 14px rgba(30,6,90,.4),0 12px 30px rgba(124,58,237,.6)}
#app{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
/* ---------- overlays ---------- */
.sheet{background:rgba(4,2,16,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet>div{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(20,12,52,.68);
 -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid transparent;border-bottom:0;box-shadow:var(--lg-hi),0 -14px 50px rgba(3,1,20,.5)}
#toast{background:rgba(255,255,255,.9);color:#140c34;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:0 10px 30px rgba(4,1,22,.45),inset 0 1px 0 #fff}
#timerpill{background:rgba(20,12,52,.62);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.22);box-shadow:var(--lg-hi),0 10px 30px rgba(4,1,22,.5)}
/* ---------- desktop sidebar and top bar ---------- */
@media (min-width:1024px){
 #side{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 50%),rgba(20,12,52,.52);
  -webkit-backdrop-filter:blur(28px) saturate(185%);backdrop-filter:blur(28px) saturate(185%);border:1px solid transparent;border-radius:32px;box-shadow:var(--lg-hi),0 24px 64px rgba(3,1,20,.6)}
 #side nav button{color:#e4dcff}
 #side nav button.on{background:var(--lg-pri);border:1px solid rgba(196,181,253,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(124,58,237,.5)}
 #side .upg{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
 #tbar .sr input{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:var(--lg-hi)}
 #tbar .res,#tbar .bp{background:rgba(24,15,60,.9);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.2)}
}
/* ---------- public pages (form, sport test) ---------- */
.nav{background:none}
.nav div{padding:10px;border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 55%),rgba(20,12,52,.52);
 -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid rgba(255,255,255,.2);box-shadow:var(--lg-hi),0 18px 46px rgba(3,1,20,.55)}
.nav{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.nav .btn{border-radius:22px}
.btn.ghost{background:rgba(255,255,255,.06)}
.done .ok{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* ---------- fallbacks ---------- */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
 :root{--lg-tint:rgba(24,16,62,.95)}
 .bn,.sheet>div,.nav div,#side,#toast,#timerpill{background:#1a1140}
}
@media (prefers-reduced-transparency:reduce){
 :root{--lg-tint:rgba(24,16,62,.96)}
 *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
 .bn,.sheet>div,.nav div,#side{background:#1a1140}
}
@media (prefers-contrast:more){
 :root{--lg-tint:rgba(16,9,44,.86);--lg-edge:linear-gradient(135deg,#fff,rgba(255,255,255,.4))}
 .btn,.tb,.ic,input,select,textarea{border-color:rgba(255,255,255,.55)}
}
html.lite{--lg-tint:rgba(24,16,62,.92)}
html.lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.lite .bn,html.lite .sheet>div,html.lite .nav div,html.lite #side{background:#1a1140}
@media print{*{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</head>
<body>
<main>
<header><svg viewBox="140 515 790 915" width="40" height="46" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path fill="url(#lg)" fill-rule="evenodd" d="M535 523L925 742V1200L535 1421L146 1200V742Z M535 615L226 790V1155L535 1330L846 1155V790Z M788 815L535 668L277 805V1140L535 1273L748 1150V930L600 1005L670 1043V1105L535 1183L358 1085V862L535 762L708 858Z"/></svg><div><h1 id="ttl">تست انتخاب رشتهٔ ورزشی</h1><p id="sub">چند دقیقه وقت بگذار؛ بر اساس شرایط خودت پیشنهاد می‌گیری</p></div></header>
<div id="view"></div>
</main>
<div class="nav hide" id="nav"><div><button class="btn back ghost" id="bBack">قبلی</button><button class="btn pri" id="bNext">بعدی</button></div></div>
<div id="toast"></div>

/* ---------- render ---------- */
function opt(name,v,label,type,checked){return `<label class="opt"><input type="${type}" name="${name}" value="${esc(v)}"${checked?' checked':''}><span>${esc(label)}</span></label>`}
function renderQ(q){
 const v=A[q.id];
 let h='';
 if(q.type==='html')return q.h;
 if(q.type==='num'){h=`<input type="text" inputmode="decimal" id="q_${q.id}" placeholder="${esc(q.ph||'')}" value="${v==null?'':esc(fa(v))}" autocomplete="off">`}
 else if(q.type==='seg'){h=`<div class="opts${q.col?' col':''}">${q.o.map(o=>opt(q.id,o[0],o[1],'radio',String(v)===String(o[0]))).join('')}</div>`}
 else if(q.type==='scale'){h=`<div class="scale">${[1,2,3,4,5].map(n=>opt(q.id,n,fa(n),'radio',String(v)===String(n))).join('')}</div><div class="ends"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`}
 else if(q.type==='multi'){const a=A[q.id]||[];h=`<div class="opts">${q.o.filter(o=>!(o[0]==='preg'&&A.sex!=='f')).map(o=>opt(q.id,o[0],o[1],'checkbox',a.indexOf(o[0])>=0)).join('')}</div>`}
 else if(q.type==='mot'){const m=A.mot||{};h=SP_MOT.map(([k,t])=>`<div class="f" style="margin-bottom:14px"><label class="l" style="font-weight:600;font-size:14.5px">${esc(t)}</label><div class="scale">${[1,2,3,4,5].map(n=>opt('mot_'+k,n,fa(n),'radio',String(m[k])===String(n))).join('')}</div></div>`).join('')}
 else if(q.type==='parq'){const a=A.parq||[];h=PARQ.map((t,i)=>`<div class="f" style="margin-bottom:14px"><label class="l" style="font-weight:600;font-size:14.5px">${fa(i+1)}. ${esc(t)}</label><div class="opts">${opt('pq'+i,'n','خیر','radio',a[i]==='n')}${opt('pq'+i,'y','بله','radio',a[i]==='y')}</div></div>`).join('')}
 else if(q.type==='sports'){
  const a=A[q.id]||[],by={};SPN().forEach(s=>{(by[s.cat]=by[s.cat]||[]).push(s)});
  h=Object.keys(SP_CAT).filter(c=>by[c]).map(c=>`<div class="grp"><b>${esc(SP_CAT[c])}</b><div class="opts pill">${by[c].map(s=>opt(q.id,s.k,s.ic+' '+s.n,'checkbox',a.indexOf(s.k)>=0)).join('')}</div></div>`).join('');
 }
 return `<div class="f" data-q="${q.id}"><label class="l">${esc(q.l)}${q.s?`<small>${esc(q.s)}</small>`:''}</label>${h}<div class="err"></div></div>`;
}
function intro(){
 const n=SPN().length;
 return `<div class="card"><h2>رشتهٔ مناسب تو کدام است؟</h2><p style="color:var(--mut);font-size:14.5px;margin-top:6px">با چند پرسش دربارهٔ بدن، هدف، سلیقه، سلامت و شرایطت، از میان ${fa(n)} رشتهٔ ورزشی فهرستی مرتب‌شده پیشنهاد می‌گیری. بعد از انتخاب یکی از آن‌ها، فرم اطلاعات را پر می‌کنی و برای مربی می‌فرستی.</p>
 <ul class="why" style="margin-top:12px"><li>حدود ${fa(5)} دقیقه طول می‌کشد</li><li>پیشنهاد است، نه تجویز؛ تصمیم نهایی با خودت و مربی است</li><li>پاسخ‌ها روی همین گوشی می‌ماند و جایی ارسال نمی‌شود</li></ul></div>
 ${GYM?`<div class="info">این تست برای باشگاه <b style="color:var(--tx)">${esc(GYM)}</b> آماده شده است${Object.keys(CFG.offered).length?`؛ رشته‌هایی که در باشگاه برگزار می‌شوند با نام مربی، روز و ساعت نشان داده می‌شوند`:''}.</div>`:''}
 ${Object.keys(A).length?`<div class="info">پاسخ‌های قبلی تو روی همین گوشی ذخیره است. می‌توانی ادامه بدهی یا از اول شروع کنی.</div>`:''}`;

function draw(){

 if(step<0){

  return;
 }
 if(step>=STEPS.length){return result()}
 const S=STEPS[step];
 v.innerHTML=`<div class="prog">${STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="stepname">مرحلهٔ ${fa(step+1)} از ${fa(STEPS.length)} · ${esc(S.t)}</div><div class="card">${S.q.map(renderQ).join('')}</div>`;
 nav.classList.remove('hide');$('#bBack').classList.remove('hide');
 $('#bNext').textContent=step===STEPS.length-1?'دیدن پیشنهادها':'بعدی';

/* ---------- collect and validate ---------- */
function collect(S){
 let ok=true;
 S.q.forEach(q=>{
  if(q.type==='html')return;
  const box=$('[data-q="'+q.id+'"]'),err=box&&$('.err',box);let bad='';
  if(q.type==='num'){
   const raw=en(($('#q_'+q.id)||{}).value||'').trim(),n=parseFloat(raw);
   if(raw===''||isNaN(n)){if(q.req)bad='این مورد را وارد کن'}else if(n<q.min||n>q.max)bad='عدد باید بین '+fa(q.min)+' تا '+fa(q.max)+' باشد';else A[q.id]=Math.round(n*10)/10;
  }else if(q.type==='seg'||q.type==='scale'){
   const r=document.querySelector('input[name="'+q.id+'"]:checked');
   if(r)A[q.id]=/^-?\d+$/.test(r.value)?+r.value:r.value;else if(q.req)bad='یکی را انتخاب کن';
  }else if(q.type==='multi'||q.type==='sports'){
   A[q.id]=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(x=>x.value);
  }else if(q.type==='mot'){
   const m={};SP_MOT.forEach(([k])=>{const r=document.querySelector('input[name="mot_'+k+'"]:checked');m[k]=r?+r.value:3});A.mot=m;
  }else if(q.type==='parq'){
   const a=[];let miss=0;PARQ.forEach((_,i)=>{const r=document.querySelector('input[name="pq'+i+'"]:checked');a.push(r?r.value:'');if(!r)miss++});A.parq=a;
   if(miss)bad='به همهٔ پرسش‌های ایمنی پاسخ بده';
  }
  if(box)box.classList.toggle('bad',!!bad);if(err)err.textContent=bad;if(bad)ok=false;
 });
 if(step===2){const l=A.like||[],n=A.never||[];if(l.some(k=>n.indexOf(k)>=0)){ok=false;toast('یک ورزش نمی‌تواند هم در «دوست دارم» باشد هم در «نمی‌خواهم»')}}
 save();
 return ok;
}
/* ---------- result ---------- */
function ringSvg(p){const r=28,C=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 68 68"><circle cx="34" cy="34" r="${r}" fill="none" stroke="#271c57" stroke-width="7"/><circle cx="34" cy="34" r="${r}" fill="none" stroke="url(#rgr)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}"/><defs><linearGradient id="rgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg><div>${fa(p)}</div></div>`}
function sched(o){
 if(!o)return '';
 const bits=[o.coach&&'مربی: <b>'+esc(o.coach)+'</b>',o.days&&'روزها: <b>'+esc(o.days)+'</b>',o.time&&'ساعت: <b>'+esc(o.time)+'</b>'].filter(Boolean);
 return `<div class="sch">📍 کلاس این رشته در باشگاه برگزار می‌شود${bits.length?'<br>'+bits.join(' · '):''}${o.note?'<br>'+esc(o.note):''}</div>`;
}
function topCard(r,i){
 const s=r.s;
 return `<div class="card rc top"><div class="hd"><div class="rk">${fa(i+1)}</div><div class="ic">${s.ic}</div><div class="ti"><b>${esc(s.n)}</b><span>${esc(SP_CAT[s.cat]||'')}</span></div>${ringSvg(r.score)}</div>
 <span class="lab">${spLabel(r.score)}</span>
 <p style="margin-top:10px;font-size:14.5px;color:var(--mut)">${esc(s.d)}</p>
 ${r.why.length?`<ul class="why">${r.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 ${r.warn.length?`<ul class="why w">${r.warn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 ${sched(r.off)}
 <div class="more"><b>شروع پیشنهادی:</b> ${esc(s.s)}<br><b>مکمل خوب:</b> ${esc(s.m)}</div>
 <button class="btn pri" style="width:100%;margin-top:14px" data-pick="${s.k}">انتخاب «${esc(s.n)}» و رفتن به فرم</button></div>`;
}
function rowOf(r){
 const s=r.s;
 return `<div class="row"><div class="ic">${s.ic}</div><div class="ti"><b>${esc(s.n)}</b>${r.off?` <span class="chip">در باشگاه</span>`:''}<small>${esc(SP_CAT[s.cat]||'')} · ${spLabel(r.score)}</small><div class="bar"><i style="width:${r.score}%"></i></div></div><div class="pct">${fa(r.score)}٪</div><button class="btn sm ghost sel" data-pick="${s.k}">انتخاب</button></div>`;
}
function result(){
 const v=$('#view');
 RES=spRank(A,{offered:CFG.offered,only:CFG.only});
 const L=RES.list,M=RES.metrics;
 $('#nav').classList.add('hide');
 const bmi=M.bmi?M.bmi.toFixed(1):'';
 const fl=M.fit>=3.4?'خوب':M.fit>=2.2?'متوسط':'پایین (شروع تدریجی)';
 const warn=[];
 if(RES.parqYes)warn.push('به '+fa(RES.parqYes)+' پرسش ایمنی «بله» گفته‌ای؛ قبل از شروع هر ورزشی با پزشک یا متخصص طب ورزشی مشورت کن.');
 if((A.age||30)<18)warn.push('زیر ۱۸ سال هستی؛ انتخاب رشته و شدت تمرین را با والدین و مربی مشورت کن.');
 if(!L.length){v.innerHTML='<div class="card"><h2>رشته‌ای پیدا نشد</h2><p style="color:var(--mut)">با پاسخ‌های فعلی هیچ رشته‌ای باقی نماند. «نمی‌خواهم»ها یا تحمل برخورد را بازبینی کن.</p></div><button class="btn pri" id="bEdit" style="width:100%">ویرایش پاسخ‌ها</button>';$('#bEdit').onclick=()=>{step=0;draw()};return}
 v.innerHTML=`<div class="hero"><h2>پیشنهادهای تو</h2><p>${fa(L.length)} رشته مرتب‌شده بر اساس تناسب با پاسخ‌هایت</p></div>
 ${warn.map(w=>`<div class="note">${esc(w)}</div>`).join('')}
 <div class="info">آمادگی بدنی تو: <b style="color:var(--tx)">${fl}</b>${bmi?` · شاخص توده بدنی: <b style="color:var(--tx)">${fa(bmi.replace('.','٫'))}</b>`:''}. درصدها نشان‌دهندهٔ تناسب با پاسخ‌های توست، نه احتمال موفقیت. نتیجه پیشنهاد است و تجویز پزشکی یا مربیگری نیست.</div>
 ${L.slice(0,3).map(topCard).join('')}
 ${L.length>3?`<div class="card"><h2>سایر پیشنهادها</h2><div id="rest">${L.slice(3,10).map(rowOf).join('')}</div>${L.length>10?`<button class="btn ghost sm" id="bAll" style="width:100%;margin-top:10px">نمایش همهٔ رشته‌ها (${fa(L.length-10)} مورد دیگر)</button>`:''}</div>`:''}
 <div class="stack" style="display:grid;gap:10px"><button class="btn ghost" id="bEdit">ویرایش پاسخ‌ها</button><button class="btn ghost" id="bSkip">بدون انتخاب رشته به فرم می‌روم</button></div>
 <details><summary>این پیشنهادها چطور محاسبه می‌شوند؟</summary>
  <p>هر رشته یک «پروفایل» ۱۷ بعدی دارد (استقامت، قدرت، توان، چابکی، انعطاف، تعادل، تمرکز، تیمی بودن، رقابت، برخورد، فشار روی مفاصل، هزینه، فضای باز، آب، دشواری فنی، رشد عضله و مصرف انرژی). پاسخ‌های تو با آن مقایسه می‌شود:</p>
  <ul><li>هدف تو و انگیزه‌ها (۵۴٪): هم‌خوانی ویژگی‌های رشته با هدف و انگیزه‌ات.</li><li>سلیقه (۲۸٪): تنها یا گروهی، رقابت، برخورد، محیط، سختی فنی و شدت.</li><li>شرایط عملی (۱۸٪): دسترسی به محل، بودجه.</li><li>سپس برای مشکلات مفصلی، بیماری، سن، اضافه‌وزن، بارداری و مبتدی بودن، امتیاز کم می‌شود؛ ورزش‌های محبوب تو و کلاس‌های باشگاه کمی بیشتر امتیاز می‌گیرند.</li></ul>
  <p>اصول علمی پشت این طراحی: ۱) تداوم ورزش بیشتر از «استعداد» به لذت، احساس توانمندی و ارتباط اجتماعی وابسته است
  (<a href="https://ijbnpa.biomedcentral.com/articles/10.1186/1479-5868-9-78" rel="noopener noreferrer" target="_blank">مرور نظام‌مند نظریهٔ خودتعیین‌گری در ورزش</a>)؛
  ۲) انگیزه‌های ورزش (تناسب، ظاهر، چالش، اجتماعی، لذت) با مقیاس MPAM-R سنجیده می‌شوند
  (<a href="https://selfdeterminationtheory.org/motives-for-physical-activity-measure-revised/" rel="noopener noreferrer" target="_blank">معرفی مقیاس</a>)؛
  ۳) در تشخیص استعداد ورزشی، ترکیب ویژگی‌های بدنی، فیزیولوژیک و روان‌شناختی بهتر از یک شاخص تنهاست و هیچ آزمونی آینده را قطعی پیش‌بینی نمی‌کند
  (<a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10772031/" rel="noopener noreferrer" target="_blank">مرور نظام‌مند</a>)؛
  ۴) غربالگری ایمنی با الهام از پرسشنامهٔ PAR-Q+ انجام می‌شود.</p></details>`;
 v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));
 const all=$('#bAll');if(all)all.onclick=()=>{$('#rest').innerHTML=L.slice(3).map(rowOf).join('');all.remove();v.querySelectorAll('#rest [data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick))};
 $('#bEdit').onclick=()=>{step=0;draw();scrollTo(0,0)};
 $('#bSkip').onclick=()=>go('');
 scrollTo(0,0);
}
function go(k){
 const rec=(RES&&RES.list||[]).slice(0,3).map(r=>r.k).join(',');
 const u=new URL('form.html',location.href),p=new URLSearchParams(location.search);
 if(k){p.set('sp',k);p.set('spn',(SPORT_BY[k]||{}).n||'');if(rec)p.set('sr',rec)}
 u.search=p.toString();
 const h=new URLSearchParams();['bp','bk','bc'].forEach(x=>{const v=HP.get(x);if(v)h.set(x,v)});
 u.hash=h.toString();
 if(k)LS.set('gf_sport_pick',JSON.stringify({k,t:Date.now()}));
 location.href=u.toString();
}
function pick(k){
 const s=SPORT_BY[k];if(!s)return;
 if(!confirm('رشتهٔ «'+s.n+'» انتخاب شود و به فرم بروی؟'))return;
 go(k);
}
$('#bNext').onclick=()=>{
 if(step<0){step=0;draw();scrollTo(0,0);return}
 if(!collect(STEPS[step])){const b=document.querySelector('.f.bad');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});return}
 step++;draw();scrollTo(0,0);
};
$('#bBack').onclick=()=>{if(step>=0){if(!(step<STEPS.length))return;collect(STEPS[step]);step--;draw();scrollTo(0,0)}};
/* optional file config (uploaded next to this page) */
if(!sc&&/^https?:/.test(location.protocol)){fetch('sports-config.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{if(o){parseCfg(o);applyCustom();if(CFG.gym){$('#sub').textContent=CFG.gym+' · پیشنهاد رشته بر اساس شرایط تو'}}}).catch(()=>{})}
draw();
})();
</script>
</body>
