<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="description" content="GrowFit: برنامه تمرین، تغذیه و آنالیز">
<title>GrowFit</title>
<style>
@font-face{font-family:"Vazirmatn";font-weight:400;font-display:swap;src:local("Vazirmatn"),local("Vazirmatn Regular"),url("fonts/Vazirmatn-Regular.woff2") format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:700;font-display:swap;src:local("Vazirmatn Bold"),url("fonts/Vazirmatn-Bold.woff2") format("woff2")}
:root{--ice:#C6F432;--cta:#C6F432;--ink:#0a0a0a;--W:min(165vw,92vh);color-scheme:dark;
 --font:Vazirmatn,"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#0D0D0D;overflow:hidden;font-family:var(--font);color:#fff;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#0D0D0D;cursor:default}
.layer{position:absolute;inset:0;pointer-events:none}
#grid{background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
 background-size:44px 44px;background-position:center;opacity:0;
 -webkit-mask-image:radial-gradient(closest-side at 50% 44%,#000 20%,transparent 92%);mask-image:radial-gradient(closest-side at 50% 44%,#000 20%,transparent 92%)}
#circ{width:100%;height:100%}
#circ path{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1}
#circ circle{fill:#C6F432;opacity:0}
#core{position:absolute;left:50%;top:44%;width:0;height:0}
#ring{position:absolute;width:calc(var(--W)*.58);aspect-ratio:1;left:calc(var(--W)*-.29);top:calc(var(--W)*-.29);opacity:0;will-change:transform,opacity}
#ring svg{width:100%;height:100%;overflow:visible;filter:none}
#ring .g{transform-origin:200px 200px;transform-box:view-box}
#pct{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(18px,4.4vw,30px)/1 var(--font);direction:ltr;color:#FFFFFF;font-variant-numeric:tabular-nums}
#ring,#burst{display:none}
#burst{position:absolute;width:calc(var(--W)*.9);aspect-ratio:1;left:calc(var(--W)*-.45);top:calc(var(--W)*-.45);overflow:visible}
#burst line{stroke:#FFFFFF;stroke-width:1.6;stroke-linecap:round;opacity:0}
#reveal{position:absolute;inset:0;pointer-events:none;will-change:transform,filter}
#logo{position:absolute;display:block;width:var(--W);height:var(--W);left:calc(var(--W)*-.518);top:calc(var(--W)*-.472);max-width:none;user-select:none;-webkit-user-drag:none}
#band,#flash{mix-blend-mode:screen}
#cta{position:absolute;left:0;right:0;bottom:calc(6vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
#cta.show{opacity:1;transform:none;pointer-events:auto}
#enter{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(86vw,360px);height:56px;padding:0 8px;border:0;border-radius:999px;background:var(--cta);color:var(--ink);font:800 17px/1 var(--font);cursor:pointer;transition:transform .2s ease}
#enter:active{transform:scale(.97)}
#enter i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--cta)}
#enter svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#enter span{flex:1;text-align:center}
.ghost{background:none;border:0;color:rgba(255,255,255,.62);font:500 13px/1 var(--font);padding:10px 14px;cursor:pointer;border-radius:999px}
#skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;opacity:0;transition:opacity .4s}
#skip.on{opacity:1}
button:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
#stage.idle #logo{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){#stage.idle #logo{animation:none}#cta{transition:none}}
.pill2{display:inline-flex;align-items:center;justify-content:center;width:min(86vw,360px);height:48px;border-radius:999px;background:#1A1A1A;border:1px solid rgba(255,255,255,.07);color:#fff;font:700 15px/1 var(--font);text-decoration:none;cursor:pointer;transition:transform .2s ease,border-color .2s ease}
.pill2:hover{border-color:rgba(198,244,50,.35)}.pill2:active{transform:scale(.97)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;max-width:92vw}
.links a,.links button{color:#C6F432;background:none;border:0;font:700 13px/1 var(--font);text-decoration:none;padding:12px 10px;cursor:pointer;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.links .ghost{color:#8A8A8A;font-weight:400}
a:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
</style>
<noscript><style>#cta{opacity:1;transform:none;pointer-events:auto}#enter{display:none}</style></noscript>
</head>

      <a id="lnkForm" href="form.html">فرم ثبت‌نام شاگرد</a>
      <a id="lnkSport" href="sport.html">تست انتخاب رشته</a>
      <button id="replay" class="ghost" type="button">پخش دوباره</button>
    </div>
  </div>
</main>

<script>
// Start page of GrowFit. The main button opens the app (role chooser: coach / student).
const ENTER_URL = "coach.html";
// Installed student app that already has data: go straight to it (the intro is only for first visits / the browser).
try{
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const q=new URLSearchParams(location.search);
  if(standalone&&!q.has('intro')&&localStorage.getItem('growfit_student_v2')&&!localStorage.getItem('growfit_full_v2')){location.replace('student.html');}
}catch(e){}

const $ = s => document.querySelector(s);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const easeOut = x => 1-Math.pow(1-clamp(x),3);
const easeIO = x => { x=clamp(x); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
const stage=$('#stage'), grid=$('#grid'), paths=[...document.querySelectorAll('#circ path')], dots=[...document.querySelectorAll('#circ circle')];
const ring=$('#ring'), r1=$('#r1'), r2=$('#r2'), r3=$('#r3'), r4=$('#r4'), a3=$('#a3'), a4=$('#a4'), pct=$('#pct');
const reveal=$('#reveal'), band=$('#band'), flash=$('#flash'), cta=$('#cta'), skip=$('#skip'), burst=$('#burst');
const END=3.3, OFF=3.2; // skip the HUD-ring intro: start right at the logo reveal
const lines=[...Array(16)].map((_,i)=>{
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  burst.appendChild(l);
  return {el:l,a:(i/16)*Math.PI*2+(Math.random()-.5)*.25,len:22+Math.random()*50,spd:.7+Math.random()*.6};
});
let t0=0, raf=0, done=false;

function gradBand(p,w,alpha){
  return `linear-gradient(125deg,transparent ${p-w-.6}%,rgba(255,255,255,${alpha}) ${p-w}%,rgba(255,255,255,${alpha*1.5}) ${p}%,transparent ${p+.5}%)`;
}
function frame(rt){
  const t=rt+OFF;
  // background grid + circuit lines
  const g=easeOut(rt/.6);
  grid.style.opacity=(.95*g*(1-.45*clamp((t-3.7)/.6))).toFixed(3);
  const cd=1-easeOut(rt/1.0);
  paths.forEach((p,i)=>{p.style.strokeDashoffset=clamp(cd+i*.04,0,1)});
  dots.forEach(d=>{d.style.opacity=clamp((rt-.4)/.5)*(.55+.45*Math.sin(t*5+1))});

  // HUD ring
  const rin=easeOut((t-.5)/.8), col=t>3.25?easeIO((t-3.25)/.35):0;
  const sc=(.55+.45*rin)*(1-.88*col), ro=clamp(rin*(1-col*1.05));
  ring.style.opacity=ro.toFixed(3);
  ring.style.transform=`scale(${sc.toFixed(3)})`;
  const boost=260*Math.pow(clamp((t-2)/1.3),2);
  r1.style.transform=`rotate(${(-t*24).toFixed(1)}deg)`;
  r2.style.transform=`rotate(${(t*18).toFixed(1)}deg)`;
  r3.style.transform=`rotate(${(t*200+boost).toFixed(1)}deg)`;
  r4.style.transform=`rotate(${(-t*150-boost).toFixed(1)}deg)`;
  const d3=230+190*Math.sin(t*2.3); a3.style.strokeDasharray=`${d3.toFixed(0)} ${(767-d3).toFixed(0)}`;
  const d4=140+120*Math.sin(t*3.1+1); a4.style.strokeDasharray=`${d4.toFixed(0)} ${(666-d4).toFixed(0)}`;
  pct.textContent=Math.round(easeIO((t-.9)/2.3)*100);

  // collapse burst
  const be=easeOut((t-3.3)/.8);
  lines.forEach(L=>{
    const r0=14+190*be*L.spd, r1_=r0+L.len*(1-be*.4);
    L.el.setAttribute('x1',(Math.cos(L.a)*r0).toFixed(1)); L.el.setAttribute('y1',(Math.sin(L.a)*r0).toFixed(1));
    L.el.setAttribute('x2',(Math.cos(L.a)*r1_).toFixed(1)); L.el.setAttribute('y2',(Math.sin(L.a)*r1_).toFixed(1));
    L.el.style.opacity=(t>3.3&&t<4.15?clamp(1-be*1.05):0).toFixed(3);
  });

  // diagonal-sweep logo reveal with glitch
  const p=-18+143*easeIO((t-3.7)/1.6);
  if(t<3.7){reveal.style.opacity=0}
  else if(p<125){
    const m=`linear-gradient(125deg,#000 ${p-16}%,transparent ${p}%)`;
    reveal.style.opacity=1; reveal.style.webkitMaskImage=m; reveal.style.maskImage=m;
    band.style.background=gradBand(p,16,.2);
    const jit=Math.random()<.35?(Math.random()-.5)*10:0;
    reveal.style.transform=`translateX(${jit.toFixed(1)}px)`;
    reveal.style.filter=jit?`brightness(${(1.1+Math.random()*.5).toFixed(2)})`:'brightness(1.15)';
  } else {
    reveal.style.opacity=1; reveal.style.webkitMaskImage=reveal.style.maskImage='none'; reveal.style.transform='none';
    band.style.background='none';
  }

  // closing white flash: two bright diagonal slabs
  if(t>5.3&&t<6.3){
    const a=-12+125*easeIO((t-5.3)/.7), b=-12+125*easeIO((t-5.45)/.7);
    flash.style.background=`linear-gradient(125deg,transparent ${a-9}%,#fff ${a-8.4}%,#fff ${a}%,transparent ${a+.5}%,transparent ${b-9}%,#fff ${b-8.4}%,#fff ${b}%,transparent ${b+.5}%)`;
    reveal.style.filter=`brightness(${(1.25+.5*Math.sin((t-5.3)*5)).toFixed(2)})`;
  } else flash.style.background='none';
  if(t>=6.3&&reveal.style.filter) reveal.style.filter='none';

  if(t>6.1) cta.classList.add('show');
  skip.classList.toggle('on', t>.4&&t<5.8);
}
function finish(){
  done=true; cancelAnimationFrame(raf);
  frame(END);
  ring.style.opacity=0; lines.forEach(L=>L.el.style.opacity=0);
  reveal.style.opacity=1; reveal.style.webkitMaskImage=reveal.style.maskImage='none'; reveal.style.filter='none'; reveal.style.transform='none';
  flash.style.background='none'; band.style.background='none'; cta.classList.add('show'); skip.classList.remove('on');
  stage.classList.add('idle');
}
function play(){
  cancelAnimationFrame(raf); done=false; cta.classList.remove('show'); stage.classList.remove('idle');
  t0=performance.now();
  const loop=now=>{ const t=(now-t0)/1000; if(t>=END){finish();return} frame(t); raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop);
}
$('#skip').onclick=finish;
$('#replay').onclick=play;
$('#enter').onclick=()=>{ if(ENTER_URL) location.href=ENTER_URL; else play(); };
if(matchMedia('(prefers-reduced-motion:reduce)').matches) finish(); else play();
</script>
</body>
</html>
