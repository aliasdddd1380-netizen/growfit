function metrics(p){

 const tdee=bmr*({'1':1.2,'2':1.375,'3':1.55,'4':1.725}[p.activity]||1.375);
 const kcal=tdee*(1+({cut:-0.2,keep:0,bulk:0.1}[p.goal]||0));
 const pr=w*(p.goal==='cut'?2.2:1.8),f=kcal*0.25/9,c=Math.max(0,(kcal-pr*4-f*9)/4);
 const whr=(num(p.waist)&&num(p.hip))?num(p.waist)/num(p.hip):null;
 return{bmi,bmr,tdee,kcal,p:pr,f,c,whr};
}

  if(top)lb=top;

 let best=lb||tb;if(lb&&tb&&tb.date>lb.date)best=tb;
 if(!best)return null;

function calc(plan,logs){

  const r={pl:{},dn:{},ton:0,dist:0,jump:0,cond:0,srpe:0,rp:[],ses:0,ps:0,ds:0};
  const add=(o,m,x)=>{if(m)o[m]=(o[m]||0)+x};
  wk.forEach((day,di)=>{
   const L=logs[wi+'-'+di];
   if(L&&L.fin){r.ses++;if(L.rpe){r.rp.push(L.rpe);r.srpe+=L.rpe*(L.min||0)}}
   day.ex.forEach(e=>{
    const k=kindOf(e),n=nSets(e),arr=(L&&L.sets[e.id])||[],mus=MUSK.indexOf(k)>=0;
    if(mus){add(r.pl,e.m,n);add(r.pl,e.s,n*.5)}
    r.ps+=n;
    arr.forEach(x=>{if(!x||!x.d)return;
     if(k==='str')r.ton+=num(x.w)*num(x.r);
     else if(k==='dist')r.dist+=num(x.r);
     else if(k==='plyo')r.jump+=num(x.r);

    const d=doneSetCount(e,arr);if(mus){add(r.dn,e.m,d);add(r.dn,e.s,d*.5)}r.ds+=d;
   });
  });

}

function line(series,o={}){
 const n=Math.max.apply(null,series.map(s=>s.v.length));
 const all=[].concat.apply([],series.map(s=>s.v.filter(v=>v!=null)));
 if(!all.length)return '<div class="empty sm">هنوز داده‌ای ثبت نشده</div>';
 const W=320,H=140,L=34,R=10,T=12,B=22;
 let mn=o.min!=null?o.min:Math.min.apply(null,all),mx=o.max!=null?o.max:Math.max.apply(null,all);
 if(mx===mn)mx=mn+1;
 if(o.min==null){const p=(mx-mn)*.15;mn-=p;mx+=p}
 const x=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1));
 const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const f=o.f||(v=>fnum(v));
 let g='';
 [mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2b2b35"/><text x="${L-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${f(v)}</text>`});
 for(let i=0;i<n;i+=(n>14?2:1))g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${fa(i+1)}</text>`;
 series.forEach(s=>{
  const pts=[];s.v.forEach((v,i)=>{if(v!=null)pts.push([x(i),y(v)])});
  if(s.fill&&pts.length>1){const id='ar'+(lineSeq++);g+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".35"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs><path d="M${pts[0][0].toFixed(1)} ${H-B} ${pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')} L${pts[pts.length-1][0].toFixed(1)} ${H-B} Z" fill="url(#${id})"/>`}
  g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"${s.dash?' stroke-dasharray="4 4"':''}/>`;
  if(!s.dash)g+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${s.c}"/>`).join('');
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr">${g}</svg>`;
}
function heat(R,mode){
 const ms=MUSCLES.filter(m=>R.some(r=>(r.pl[m]||0)>0));
 if(!ms.length)return '<div class="empty sm">هنوز حرکتی در برنامه نیست</div>';
 return `<div class="scroll"><table class="heat"><tr><th></th>${R.map((_,i)=>`<th>${fa(i+1)}</th>`).join('')}</tr>${ms.map(m=>`<tr><th>${m}</th>${R.map(r=>{
  const p=r.pl[m]||0,d=r.dn[m]||0,v=mode==='plan'?p:d,a=mode==='plan'?Math.min(1,p/20):(p?Math.min(1,d/p):0);
  return `<td style="background:rgba(255,90,106,${(a*.7).toFixed(2)})">${v?fnum(v):'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`;
}

/* ---- link + QR ---- */
function formCfg(){
 DB.formCfg=DB.formCfg||{};const g=DB.formCfg;
 if(g.url==null){try{g.url=/^https?:/.test(location.protocol)?location.href.replace(/[#?].*$/,'').replace(/[^\/]*$/,'')+'form.html':''}catch(e){g.url=''}}
 return g;
}
function formLink(){
 const g=formCfg();if(!/^https?:\/\/[^\s]+$/i.test(g.url||''))return '';
 const q=[];if(g.n)q.push('n='+encodeURIComponent(g.n));
 const p=itEn(g.p||'').replace(/[^\d+]/g,'');if(p)q.push('c='+p);
 ['tg','ei','bl'].forEach(k=>{const v=(g[k]||'').replace(/[^A-Za-z0-9_]/g,'');if(v)q.push(k+'='+v)});
 return g.url+(q.length?(g.url.indexOf('?')<0?'?':'&')+q.join('&'):'');
}
function formLinkView(){

 let qr='';if(link){try{qr=GFQR.svg(link,{ecc:'M'})}catch(e){qr=''}}

 return shell('لینک و QR فرم','برای شاگردان دور',`<div class="pad">

  ${link?`<div class="card" style="text-align:center"><h3>QR فرم</h3><div class="qrbox">${qr}</div><p class="mut sm" style="margin:8px 0" dir="ltr">${esc(link)}</p><div class="g2"><button class="btn pri sm" style="width:100%" onclick="A.fcopy()">کپی لینک</button><button class="btn sm" style="width:100%" onclick="A.fshare()">ارسال لینک</button></div><button class="btn sm" style="width:100%;margin-top:8px" onclick="A.fqr()">ذخیرهٔ تصویر QR (برای پوستر یا استوری)</button><p class="mut sm" style="margin-top:8px">هر کسی این QR را با دوربین گوشی اسکن کند، مستقیم فرم را باز می‌کند.</p></div>`:'<div class="empty sm">آدرس را که بنویسی، QR اینجا ساخته می‌شود.</div>'}</div>`,'',"go({screen:null})");

 const l=formLink();if(!l)return;let m;try{m=GFQR.matrix(l,'M')}catch(e){return toast('ساخت QR ممکن نشد')}

 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])x.fillRect((c+q)*s,(r+q)*s,s,s);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='growfit-form-qr.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('تصویر QR ذخیره شد')},'image/png');

 const x=mealBank()[bi],slot=C().diet.meals[UI.mb.slot];if(!x||!slot)return;
 const o={id:uid(),name:x.n,desc:x.d,kcal:x.k,p:x.p,c:x.c,f:x.f,bid:x.i};
 if(slot.opts.length===1&&!num(slot.opts[0].kcal)&&!slot.opts[0].desc)slot.opts[0]=o;else slot.opts.push(o);
 save();toast('به گزینه‌های «'+(slot.name||'وعده')+'» اضافه شد');
};
A.delMeal=i=>{if(confirm('این وعده حذف شود؟')){C().diet.meals.splice(i,1);save();render()}};
A.addCorr=i=>{const it=C().corr.items;ANOM[ANOMN[i]].forEach(([n,s,r])=>{if(!it.some(x=>x.name===n))it.push({id:uid(),name:n,sets:s,reps:r,freq:3,note:''})});save();render()};
A.addCorrBlank=()=>{C().corr.items.push({id:uid(),name:'',sets:3,reps:'10',freq:3,note:''});save();render()};
A.delCorr=i=>{C().corr.items.splice(i,1);save();render()};
A.sendPlan=()=>{const c=C();if(!c.plan)return toast('اول برنامه تمرین را بساز');shareFile(planPack(c),'growfit-'+(c.name||'plan').replace(/\s+/g,'_')+'.json','برنامه تمرینی GrowFit برای '+c.name)};
A.dlPlan=()=>{const c=C();if(!c.plan)return toast('اول برنامه تمرین را بساز');dl(planPack(c),'growfit-'+(c.name||'plan').replace(/\s+/g,'_')+'.json')};
A.copyPhone=()=>{const t=en(C().phone);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('شماره کپی شد')).catch(()=>toast('کپی نشد'))};
A.aex=v=>{UI.aex=v;render()};
/* student */
A.setVal=(id,i,f,v)=>{slot(lg(),id,i)[f]=v===''?'':num(v);save()};
A.tick=(id,i)=>{
 const day=S().plan.weeks[UI.w][UI.d],e=day.ex.find(x=>x.id===id),L=lg();if(!e)return;if(!L.start)L.start=Date.now();
 const sl=slotsOf(e,effW(e,UI.w))[i];if(!sl)return;
 const s=slot(L,id,i);s.d=!s.d;
 if(s.d){
  if(s.w==='')s.w=sl.w||'';if(s.r==='')s.r=sl.r||'';
  let rest=sl.rest;
  if(e.g){const mem=day.ex.filter(x=>x.g===e.g);if(mem[mem.length-1].id!==e.id)rest=num(e.ir)}
  startTimer(rest);
 }
 save();render();
};
A.find=id=>{UI.find=(UI.find===id?'':id);UI.fx='';render()};
A.fx=id=>{UI.fx=(UI.fx===id?'':id);UI.find='';render()};
A.doFind=id=>{
 const e=S().plan.weeks[UI.w][UI.d].ex.find(x=>x.id===id),w=num($('#tw').value),r=num($('#tr').value);
 if(!e||!e.name)return toast('اسم حرکت خالی است');
 if(w<=0||r<=0)return toast('وزنه و تکرار را وارد کن');
 if(r>30)return toast('تکرار خیلی زیاد است؛ با وزنه سنگین‌تر امتحان کن');
 S().trial[e.name]={w,r,date:iso(),wk:UI.w};UI.find='';save();render();toast('وزنه کاری محاسبه شد');
};
A.rpe=n=>{lg().rpe=n;save();render()};
A.finish=()=>{
 const L=lg();if(L.fin){L.fin=false;save();render();return}
 let dn=0;Object.keys(L.sets).forEach(k=>L.sets[k].forEach(x=>{if(x&&x.d)dn++}));
 if(!dn)return toast('حداقل یک ست را تیک بزن');
 if(!L.rpe)return toast('فشار تمرین را از ۱ تا ۱۰ انتخاب کن');
 L.fin=true;L.min=L.start?Math.max(1,Math.round((Date.now()-L.start)/60000)):0;L.date=iso();save();render();toast('تمرین ثبت شد');
};
A.shift=n=>{const d=addDays(UI.date,n);if(d>iso())return;UI.date=d;render()};
const dayRec=()=>{const L=S().dietLog;const r=L[UI.date]=L[UI.date]||{m:{},c:{},o:{}};if(!r.o)r.o={};return r};
A.pickOpt=(i,j)=>{const r=dayRec();r.o[i]=+j;save();render()};
A.tickMeal=i=>{const r=dayRec();r.m[i]=!r.m[i];save();render()};
A.tickCorr=i=>{const L=S().dietLog;const r=L[iso()]=L[iso()]||{m:{},c:{}};r.c[i]=!r.c[i];save();render()};
A.addW=()=>{const v=num($('#wt').value);if(!v)return toast('وزن را وارد کن');const s=S(),d=iso(),wa=num($('#wa').value)||'';s.weights=s.weights.filter(x=>x.date!==d);s.weights.push({date:d,w:v,waist:wa});s.weights.sort((a,b)=>a.date<b.date?-1:1);save();render();toast('وزن ثبت شد')};
const logPack=()=>{const s=S(),p=s.profile||{};return{pack:{app:'fitplan',kind:'log',v:1,cid:s.cid,planId:s.plan.id,name:p.name,exported:Date.now(),start:s.start,logs:s.logs,weights:s.weights,dietLog:s.dietLog},file:'growfit-report-'+(p.name||'student').replace(/\s+/g,'_')+'-'+iso()+'.json',title:'گزارش '+(p.name||'')}};
A.sendLog=()=>{const x=logPack();shareFile(x.pack,x.file,x.title)};
A.dlLog=()=>{const x=logPack();dl(x.pack,x.file);toast('فایل گزارش دانلود شد')};

/* ================= init ================= */
$('#lib').innerHTML=LIB.map(l=>`<option value="${esc(l[0])}">`).join('');
normDB();
if(DB.role==='student')UI.w=firstOpenWeek();
render(false);
if(typeof window!=='undefined'){
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.screen==='settings'||(DB.role==='student'&&UI.sTab==='me'))render()});
 window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('برنامه نصب شد');render()});
 window.addEventListener('afterprint',()=>{const r=$('#printroot');if(r)r.innerHTML=''});
}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
