#app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
h3{font-size:15px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.tt{flex:1;min-width:0}
.tt h1{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{color:var(--mut);font-size:13px}
.mk{display:flex;flex:none;width:40px;height:40px;align-items:center;justify-content:center}
.ic{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font-size:18px}
.pad{padding:8px 16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card.tap{cursor:pointer}
.card.tap:active{border-color:var(--or)}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 4px}
.f{margin-bottom:10px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font:inherit;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
[data-n],.n{direction:ltr;text-align:center}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 input{padding:8px 4px;font-size:14px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:700;text-align:center;text-decoration:none;margin:0 0 10px;cursor:pointer}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--bg)}
.btn.danger{color:var(--err)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s3);font-size:12px;color:var(--mut)}
.chip.or{background:rgba(255,255,255,.12);color:var(--or2)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tb{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:14px}
.tb.on{background:var(--or);border-color:var(--or);color:var(--bg);font-weight:700}
.empty{padding:26px 14px;text-align:center;color:var(--mut)}
.empty.sm{padding:12px}
.bar{height:6px;background:var(--s3);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border:0}
.kv small{color:var(--mut);font-weight:400;margin-inline-start:4px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macros div{background:var(--s2);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--mut)}
.macros b{display:block;font-size:17px;color:var(--or2)}
.ex .name{font-weight:700;font-size:16px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.ex .acts{display:flex;gap:6px}
.ex .acts button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx)}
.ex .acts .x{color:var(--err)}
.srow{display:grid;grid-template-columns:minmax(34px,auto) 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.si{color:var(--mut);text-align:center}
.shead{display:grid;grid-template-columns:minmax(34px,auto) 1fr 1fr 46px;gap:8px;font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.ck{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:22px;font-weight:800}
.ck.on{background:var(--or);border-color:var(--or);color:var(--bg)}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.rpe button{padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:700}
.rpe button.on{background:var(--or);border-color:var(--or);color:var(--bg)}
.barnav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,31,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:4px;max-width:560px;margin:0 auto}
.barnav button{flex:1;padding:10px 0;border:0;background:transparent;color:var(--mut);font:inherit;font-size:13.5px;border-radius:10px;border-top:3px solid transparent}
.barnav button.on{color:var(--or);border-top-color:var(--or);font-weight:700}
.mrow{display:grid;grid-template-columns:84px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.mrow .nums{text-align:left;direction:ltr;color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile b{display:block;font-size:19px}
.tile span{font-size:12.5px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:#8fa2b4;font-size:9px}
.scroll{overflow-x:auto}
.heat{border-collapse:collapse;font-size:12px;width:100%}
.heat th{font-weight:600;color:var(--mut);padding:4px 6px;text-align:center;white-space:nowrap}
.heat td{padding:5px 6px;text-align:center;border:1px solid var(--s1);min-width:34px}
.heat tr th:first-child{text-align:right;position:sticky;right:0;background:var(--s1)}
.days{display:flex;gap:6px;margin-top:8px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.days .bar{height:44px;display:flex;align-items:flex-end;margin-bottom:4px;border-radius:8px}
.days .bar i{width:100%}
.mealck{display:flex;gap:12px;align-items:center}
.mealck .ck{flex:none;width:40px;height:40px;font-size:18px}
.note{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.4);color:var(--amb);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.hero{text-align:center;padding:44px 20px 10px}
.hero svg{width:116px;height:116px}
.hero h1{font-size:38px;margin-top:14px;letter-spacing:.5px}
.hero p{color:var(--mut);margin:6px 0 26px}
#timerpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--s3);border:1px solid var(--or);color:var(--tx);border-radius:99px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;z-index:5;font-size:14px}
#timerpill.show{display:flex}
#timerpill.go{background:var(--or);color:var(--bg);font-weight:800}
#timerpill button{border:0;border-radius:99px;padding:5px 12px;background:rgba(15,23,31,.35);color:inherit;font:inherit;font-size:12px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);border-radius:12px;padding:9px 18px;font-weight:700;font-size:14px;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.chip.sys{background:transparent;border:1px solid var(--sp,var(--ice));color:var(--sp,var(--ice))}
.card.sk{border-right:3px solid var(--or)}
.card.grp{border-right:3px solid var(--sp,var(--ice))}
.sep{height:1px;background:var(--line);margin:14px 0}
.si small{display:block;font-size:10px;line-height:1.2}
.g5 label{font-size:11px;line-height:1.3;min-height:28px}
.sg{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--s2);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.lnk{background:none;border:0;color:var(--or);font:inherit;font-size:13px;text-decoration:underline;padding:4px 6px}
.fx{background:var(--s2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.fx p{margin:6px 0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

function metrics(p){
 const w=num(p.weight),h=num(p.height),a=num(p.age);if(!w||!h||!a)return null;
 const bmi=w/Math.pow(h/100,2);
 const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
 const tdee=bmr*({'1':1.2,'2':1.375,'3':1.55,'4':1.725}[p.activity]||1.375);
 const kcal=tdee*(1+({cut:-0.2,keep:0,bulk:0.1}[p.goal]||0));
 const pr=w*(p.goal==='cut'?2.2:1.8),f=kcal*0.25/9,c=Math.max(0,(kcal-pr*4-f*9)/4);
 const whr=(num(p.waist)&&num(p.hip))?num(p.waist)/num(p.hip):null;
 return{bmi,bmr,tdee,kcal,p:pr,f,c,whr};
}
const bmiCat=b=>b<18.5?'کم‌وزن':b<25?'نرمال':b<30?'اضافه‌وزن':'چاقی';
const repsList=e=>(String(en(e.reps)).match(/\d+/g)||[]).map(Number);
const isPy=e=>e.sys==='py'||e.sys==='rpy'||e.sys==='bpy';
function nSets(e){return isPy(e)?(repsList(e).length||1):Math.max(1,num(e.sets)||1)}
function slotsOf(e,W){
 const o=[],push=(set,step,lab,cap,w,r,rest)=>o.push({set,step,lab,cap,w,r,rest});
 const n=nSets(e),RS=num(e.rest),r0=firstNum(e.reps),sys=e.sys||'st';
 const dw=f=>W?rnd(W*f):'';
 const lb=(st,i,j)=>st>1?fa(i+1)+'.'+fa(j+1):fa(i+1);
 if(sys==='py'||sys==='rpy'||sys==='bpy'){const arr=repsList(e),p=num(e.p)||10;(arr.length?arr:[8]).forEach((r,i)=>push(i,0,fa(i+1),'',sys==='bpy'?'':dw(Math.pow(1+p/100,sys==='py'?i:-i)),r,RS));return o}
 if(sys==='s21'){for(let i=0;i<n;i++)['پایین','بالا','کامل'].forEach((c,j)=>push(i,j,lb(3,i,j),c,dw(1),7,j<2?0:RS));return o}
 if(sys==='ds'){const st=1+(num(e.x)||2),p=num(e.p)||20;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),j?'دراپ':'',dw(Math.pow(1-p/100,j)),r0,j<st-1?0:RS);return o}
 if(sys==='rp'){const st=1+(num(e.x)||2),ir=num(e.ir)||15;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),j?'مینی‌ست':'',dw(1),j?'':r0,j<st-1?ir:RS);return o}
 if(sys==='cl'){const st=num(e.x)||4,ir=num(e.ir)||20;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),'خوشه',dw(1),r0,j<st-1?ir:RS);return o}
 const k=kindOf(e),RS2=k==='game'?num(e.rest)*60:RS;
 const w0=k==='str'?(W||''):(MUSK.indexOf(k)>=0?(num(e.weight)||''):'');
 const r=k==='dist'?num(e.dist):(k==='int'||k==='game')?num(e.work):r0;
 for(let i=0;i<n;i++)push(i,0,fa(i+1),'',w0,r,RS2);
 return o;
}
function doneSetCount(e,arr){const seen={};slotsOf(e,0).forEach((z,i)=>{if(arr&&arr[i]&&arr[i].d)seen[z.set]=1});return Object.keys(seen).length}
function dayBlocks(day){const seen={},out=[];day.ex.forEach(e=>{if(e.g){if(seen[e.g])return;seen[e.g]=1;out.push(day.ex.filter(x=>x.g===e.g))}else out.push([e])});return out}
const e1rm=(w,r)=>w*(1+Math.min(r,12)/30);
function repsT(e){const t=repsList(e);return t.length?Math.round(t.reduce((a,b)=>a+b,0)/t.length):10}
function sugg(e,wi){
 const s=S(),p=s.plan;if(!p||!e.name||kindOf(e)!=='str')return null;
 let tb=null,lb=null;const tr=(s.trial||{})[e.name];
 if(tr&&num(tr.w)>0&&num(tr.r)>0)tb={E:e1rm(num(tr.w),num(tr.r)),wb:num(tr.wk),date:tr.date||'',src:'trial',bw:num(tr.w),br:Math.min(num(tr.r),12)};
 for(let w=0;w<wi&&w<p.weeks.length;w++){
  let top=null;
  p.weeks[w].forEach((day,di)=>{const L=s.logs[w+'-'+di];if(!L)return;day.ex.forEach(x=>{if(x.name!==e.name||kindOf(x)!=='str')return;(L.sets[x.id]||[]).forEach(z=>{if(z&&z.d&&num(z.w)>0&&num(z.r)>0){const E=e1rm(num(z.w),num(z.r));if(!top||E>top.E)top={E,wb:w,date:L.date||'',src:'log',bw:num(z.w),br:Math.min(num(z.r),12)}}})})});
  if(top)lb=top;
 }
 let best=lb||tb;if(lb&&tb&&tb.date>lb.date)best=tb;
 if(!best)return null;
 const TR=repsT(e),RIR=(p.rir==null||p.rir==='')?2:num(p.rir),pct=(p.prog==null||p.prog==='')?2.5:num(p.prog);
 const W0=best.E/(1+(TR+RIR)/30),steps=Math.max(0,wi-best.wb);
 let W=W0*Math.pow(1+pct/100,steps);
 const dl=num(p.dl);let dlf=1;if(dl>1&&(wi+1)%dl===0){dlf=0.9;W*=dlf}
 return{w:rnd(W),W0,E:best.E,TR,RIR,steps,pct,dlf,src:best.src,bw:best.bw,br:best.br,wb:best.wb};
}
const effW=(e,wi)=>{if(num(e.weight))return num(e.weight);if(kindOf(e)!=='str')return 0;const g=sugg(e,wi);return g?g.w:0};
function calc(plan,logs){
 return plan.weeks.map((wk,wi)=>{
  const r={pl:{},dn:{},ton:0,dist:0,jump:0,cond:0,srpe:0,rp:[],ses:0,ps:0,ds:0};
  const add=(o,m,x)=>{if(m)o[m]=(o[m]||0)+x};
  wk.forEach((day,di)=>{
   const L=logs[wi+'-'+di];
   if(L&&L.fin){r.ses++;if(L.rpe){r.rp.push(L.rpe);r.srpe+=L.rpe*(L.min||0)}}
   day.ex.forEach(e=>{
    const k=kindOf(e),n=nSets(e),arr=(L&&L.sets[e.id])||[],mus=MUSK.indexOf(k)>=0;
    if(mus){add(r.pl,e.m,n);add(r.pl,e.s,n*.5)}
    r.ps+=n;
    arr.forEach(x=>{if(!x||!x.d)return;
     if(k==='str')r.ton+=num(x.w)*num(x.r);
     else if(k==='dist')r.dist+=num(x.r);
     else if(k==='plyo')r.jump+=num(x.r);
     else if(k==='int')r.cond+=num(x.r)/60;
     else if(k==='game')r.cond+=num(x.r)});
    const d=doneSetCount(e,arr);if(mus){add(r.dn,e.m,d);add(r.dn,e.s,d*.5)}r.ds+=d;
   });
  });
  r.rpe=r.rp.length?r.rp.reduce((a,b)=>a+b,0)/r.rp.length:null;
  return r;
 });
}
function adh(dietLog,start,meals,date){
 if(!meals.length||(start&&date<start)||date>iso())return null;
 const rec=dietLog[date];const n=rec?Object.values(rec.m||{}).filter(Boolean).length:0;
 return n/meals.length;
}
function adhWeek(dietLog,start,meals){
 const v=[];for(let i=6;i>=0;i--){v.push(adh(dietLog,start,meals,addDays(iso(),-i)))}
 const ok=v.filter(x=>x!==null);return{days:v,avg:ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null};
}

/* ================= charts ================= */
function line(series,o={}){
 const n=Math.max.apply(null,series.map(s=>s.v.length));
 const all=[].concat.apply([],series.map(s=>s.v.filter(v=>v!=null)));
 if(!all.length)return '<div class="empty sm">هنوز داده‌ای ثبت نشده</div>';
 const W=320,H=140,L=34,R=10,T=12,B=22;
 let mn=o.min!=null?o.min:Math.min.apply(null,all),mx=o.max!=null?o.max:Math.max.apply(null,all);
 if(mx===mn)mx=mn+1;
 if(o.min==null){const p=(mx-mn)*.15;mn-=p;mx+=p}
 const x=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1));
 const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const f=o.f||(v=>fnum(v));
 let g='';
 [mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#354a5d"/><text x="${L-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${f(v)}</text>`});
 for(let i=0;i<n;i+=(n>14?2:1))g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${fa(i+1)}</text>`;
 series.forEach(s=>{
  const pts=[];s.v.forEach((v,i)=>{if(v!=null)pts.push([x(i),y(v)])});
  g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"${s.dash?' stroke-dasharray="4 4"':''}/>`;
  if(!s.dash)g+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${s.c}"/>`).join('');
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr">${g}</svg>`;
}
function heat(R,mode){
 const ms=MUSCLES.filter(m=>R.some(r=>(r.pl[m]||0)>0));
 if(!ms.length)return '<div class="empty sm">هنوز حرکتی در برنامه نیست</div>';
 return `<div class="scroll"><table class="heat"><tr><th></th>${R.map((_,i)=>`<th>${fa(i+1)}</th>`).join('')}</tr>${ms.map(m=>`<tr><th>${m}</th>${R.map(r=>{
  const p=r.pl[m]||0,d=r.dn[m]||0,v=mode==='plan'?p:d,a=mode==='plan'?Math.min(1,p/20):(p?Math.min(1,d/p):0);
  return `<td style="background:rgba(111,179,232,${(a*.7).toFixed(2)})">${v?fnum(v):'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`;
}

function analyticsHTML(plan,logs){
 const R=calc(plan,logs),nd=plan.days.length*plan.weeks.length;
 const sum=f=>R.reduce((a,r)=>a+r[f],0);
 const ses=sum('ses'),ps=sum('ps'),ds=sum('ds'),ton=sum('ton'),dist=sum('dist'),jump=sum('jump'),cond=sum('cond'),sr=sum('srpe');
 const all=[].concat.apply([],R.map(r=>r.rp)),rpe=all.length?all.reduce((a,b)=>a+b,0)/all.length:null;
 UI.aw=Math.min(UI.aw,R.length-1);
 const cur=R[UI.aw],hasMus=R.some(r=>Object.keys(r.pl).length>0);
 let ac=null;{const pv=R.slice(Math.max(0,UI.aw-4),UI.aw).map(r=>r.srpe).filter(v=>v>0);if(cur.srpe>0&&pv.length)ac=cur.srpe/(pv.reduce((a,b)=>a+b,0)/pv.length)}
 const ms=MUSCLES.filter(m=>(cur.pl[m]||0)>0).sort((a,b)=>cur.pl[b]-cur.pl[a]);
 const tile=(b,t)=>`<div class="tile"><b>${b}</b><span>${t}</span></div>`;
 const T=[tile(fa(ses)+' از '+fa(nd),'جلسه انجام‌شده'),tile('٪'+fa(ps?Math.round(ds/ps*100):0),'ست‌های انجام‌شده'),tile(rpe==null?'—':fnum(rpe),'میانگین فشار (از ۱۰)'),ton>0?tile(fa(Math.round(ton).toLocaleString('en-US')),'حجم کل (کیلوگرم)'):tile(fa(Math.round(sr)),'بار کل جلسه‌ها (فشار × دقیقه)')];
 if(dist>0)T.push(tile(fa(Math.round(dist).toLocaleString('en-US')),'مسافت دویدن (متر)'));
 if(jump>0)T.push(tile(fa(Math.round(jump)),'تماس‌های پلایومتریک'));
 if(cond>0)T.push(tile(fnum(cond),'اینتروال و بازی (دقیقه)'));
 if(ac!=null)T.push(tile(fnum(ac),'نسبت بار حاد به مزمن (هفته انتخابی)'));
 const ch=(t,v,o)=>v.some(x=>x>0)?`<div class="card"><h3>${t}</h3>${line([{v:v.map(x=>x||null),c:'#ffffff'}],o||{})}</div>`:'';
 const ri=v=>fa(Math.round(v));
 const names=[];plan.weeks.forEach(w=>w.forEach(d=>d.ex.forEach(e=>{if(e.name&&kindOf(e)==='str'&&names.indexOf(e.name)<0)names.push(e.name)})));
 if(names.indexOf(UI.aex)<0)UI.aex=names[0]||'';
 const act=plan.weeks.map((wk,wi)=>{let mx=null;wk.forEach((day,di)=>{const L=logs[wi+'-'+di];day.ex.forEach(e=>{if(e.name!==UI.aex||!L)return;(L.sets[e.id]||[]).forEach(x=>{if(x&&x.d&&num(x.w)>(mx||0))mx=num(x.w)})})});return mx});
 const pln=plan.weeks.map(wk=>{let mx=null;wk.forEach(day=>day.ex.forEach(e=>{if(e.name===UI.aex&&num(e.weight)>(mx||0))mx=num(e.weight)}));return mx});
 return `<div class="tiles">${T.join('')}</div>${ac!=null?'<p class="mut sm" style="margin:-4px 0 12px">نسبت بار حاد به مزمن بین ۰٫۸ تا ۱٫۳ معمولاً محدوده مناسبی است.</p>':''}
 ${hasMus?`<div class="card"><h3>ست هر عضله در یک هفته</h3><div class="strip" style="padding:0 0 8px">${R.map((_,i)=>`<button class="tb ${i===UI.aw?'on':''}" onclick="go({aw:${i}})">هفته ${fa(i+1)}</button>`).join('')}</div>
 ${ms.map(m=>{const p=cur.pl[m],d=cur.dn[m]||0;return `<div class="mrow"><span>${m}</span><div class="bar"><i style="width:${Math.min(100,d/p*100)}%"></i></div><span class="nums">${fnum(d)}/${fnum(p)}</span></div>`}).join('')||'<div class="empty sm">این هفته حرکتی ندارد</div>'}</div>`:`<div class="strip" style="padding:0 0 8px">${R.map((_,i)=>`<button class="tb ${i===UI.aw?'on':''}" onclick="go({aw:${i}})">هفته ${fa(i+1)}</button>`).join('')}</div>`}
 ${ch('حجم تمرین هر هفته (کیلوگرم)',R.map(r=>r.ton),{f:ri})}
 ${ch('بار تمرین هر هفته (فشار × دقیقه)',R.map(r=>r.srpe),{f:ri})}
 ${ch('مسافت دویدن هر هفته (متر)',R.map(r=>r.dist),{f:ri})}
 ${ch('تماس‌های پلایومتریک هر هفته',R.map(r=>r.jump),{f:ri})}
 ${ch('اینتروال و بازی هر هفته (دقیقه)',R.map(r=>r.cond),{f:ri})}
 <div class="card"><h3>میانگین فشار تمرین هر هفته</h3>${line([{v:R.map(r=>r.rpe),c:'#6fb3e8'}],{min:1,max:10,f:v=>fa(Math.round(v))})}</div>
 ${names.length?`<div class="card"><h3>روند وزنه یک حرکت</h3><select onchange="A.aex(this.value)" style="margin-bottom:8px">${names.map(n=>`<option${n===UI.aex?' selected':''}>${esc(n)}</option>`).join('')}</select>${line([{v:pln,c:'#5d7288',dash:1},{v:act,c:'#ffffff'}])}<p class="mut sm">خط سفید: بیشترین وزنه انجام‌شده. خط خاکستری: وزنه برنامه.</p></div>`:''}
 ${hasMus?`<div class="card"><h3>جدول ست‌های انجام‌شده (عضله × هفته)</h3>${heat(R,'done')}</div>`:''}`;
}

let tmr=null;
function stopTimer(){clearInterval(tmr);$('#timerpill').className=''}
function startTimer(sec){
 if(!sec)return;clearInterval(tmr);const el=$('#timerpill'),end=Date.now()+sec*1000;el.className='show';
 const tick=()=>{const r=Math.ceil((end-Date.now())/1000);
  if(r<=0){clearInterval(tmr);el.className='show go';el.innerHTML='وقت ست بعدی است <button onclick="stopTimer()">بستن</button>';try{navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(el.className==='show go')el.className=''},8000);return}
  el.innerHTML='استراحت <b>'+fa(pad(Math.floor(r/60))+':'+pad(r%60))+'</b> <button onclick="stopTimer()">رد کردن</button>'};
 tick();tmr=setInterval(tick,500);
}

function dl(obj,name){const b=new Blob([JSON.stringify(obj)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function shareFile(obj,name,title){
 const f=new File([JSON.stringify(obj)],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return}}catch(e){if(e&&e.name==='AbortError')return}
 dl(obj,name);toast('فایل ذخیره شد؛ از پوشه دانلودها داخل پیام‌رسان بفرست');
}
function pickFile(){$('#file').click()}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(err){return toast('فایل معتبر نیست')}handleFile(d)};
function importPlan(d){
 const s=S(),same=s.plan&&s.plan.id===d.plan.id;
 if(!same&&s.plan&&Object.keys(s.logs).length&&!confirm('این برنامه با برنامه فعلی فرق دارد و ثبت‌های قبلی پاک می‌شود. ادامه می‌دهی؟'))return false;
 s.cid=d.cid;s.profile=d.profile;s.plan=d.plan;s.diet=d.diet||{meals:[]};s.corr=d.corr||{items:[],note:''};
 if(!same){s.logs={};s.dietLog={};s.weights=[];s.start=iso()}
 if(!s.weights.length&&num(d.profile.weight))s.weights.push({date:iso(),w:num(d.profile.weight),waist:num(d.profile.waist)||''});
 DB.role='student';save();return true;
}
function handleFile(d){
 if(!d||d.app!=='fitplan')return toast('این فایل مال گروفیت نیست');
 if(d.kind==='plan'){
  if(DB.role==='coach')return toast('در حالت مربی فقط گزارش شاگرد وارد می‌شود');
  if(!importPlan(d))return;UI.screen=null;UI.sTab='train';UI.w=firstOpenWeek();UI.d=0;render(false);toast('برنامه وارد شد');
 }else if(d.kind==='log'){
  if(DB.role!=='coach'||!UI.unlocked)return toast('گزارش فقط در حالت مربی باز می‌شود');
  const c=DB.clients.find(x=>x.id===d.cid)||DB.clients.find(x=>x.plan&&x.plan.id===d.planId);
  if(!c)return toast('شاگردی با این گزارش پیدا نشد');
  c.logs={at:d.exported,logs:d.logs||{},weights:d.weights||[],dietLog:d.dietLog||{},start:d.start};
  save();UI.screen=null;UI.cid=c.id;UI.ctab='rep';render(false);toast('گزارش '+(c.name||'شاگرد')+' ثبت شد');
 }else if(d.kind==='backup'){
  if(confirm('همه اطلاعات فعلی با پشتیبان جایگزین شود؟')){DB=d.data;DB.student.trial=DB.student.trial||{};if(BUILD==='student'){DB.role=DB.role==='coach'?null:DB.role;DB.clients=[];DB.pin=null}UI.unlocked=false;save();UI.screen=null;UI.cid=null;render(false);toast('بازیابی شد')}
 }
}

function hp(s){let h1=0xdeadbeef,h2=0x41c6ce57;const t='fp|'+s+'|k9x';for(let r=0;r<2000;r++){for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909)}return(h2>>>0).toString(16)+(h1>>>0).toString(16)}

 save();render();
};
A.find=id=>{UI.find=(UI.find===id?'':id);UI.fx='';render()};
A.fx=id=>{UI.fx=(UI.fx===id?'':id);UI.find='';render()};
A.doFind=id=>{
 const e=S().plan.weeks[UI.w][UI.d].ex.find(x=>x.id===id),w=num($('#tw').value),r=num($('#tr').value);
 if(!e||!e.name)return toast('اسم حرکت خالی است');
 if(w<=0||r<=0)return toast('وزنه و تکرار را وارد کن');
 if(r>30)return toast('تکرار خیلی زیاد است؛ با وزنه سنگین‌تر امتحان کن');
 S().trial[e.name]={w,r,date:iso(),wk:UI.w};UI.find='';save();render();toast('وزنه کاری محاسبه شد');
};
A.rpe=n=>{lg().rpe=n;save();render()};
A.finish=()=>{
 const L=lg();if(L.fin){L.fin=false;save();render();return}
 let dn=0;Object.keys(L.sets).forEach(k=>L.sets[k].forEach(x=>{if(x&&x.d)dn++}));
 if(!dn)return toast('حداقل یک ست را تیک بزن');
 if(!L.rpe)return toast('فشار تمرین را از ۱ تا ۱۰ انتخاب کن');
 L.fin=true;L.min=L.start?Math.max(1,Math.round((Date.now()-L.start)/60000)):0;L.date=iso();save();render();toast('تمرین ثبت شد');
};
A.shift=n=>{const d=addDays(UI.date,n);if(d>iso())return;UI.date=d;render()};
const dayRec=()=>{const L=S().dietLog;return L[UI.date]=L[UI.date]||{m:{},c:{}}};
A.tickMeal=i=>{const r=dayRec();r.m[i]=!r.m[i];save();render()};
A.tickCorr=i=>{const L=S().dietLog;const r=L[iso()]=L[iso()]||{m:{},c:{}};r.c[i]=!r.c[i];save();render()};
A.addW=()=>{const v=num($('#wt').value);if(!v)return toast('وزن را وارد کن');const s=S(),d=iso(),wa=num($('#wa').value)||'';s.weights=s.weights.filter(x=>x.date!==d);s.weights.push({date:d,w:v,waist:wa});s.weights.sort((a,b)=>a.date<b.date?-1:1);save();render();toast('وزن ثبت شد')};
A.sendLog=()=>{const s=S(),p=s.profile||{};shareFile({app:'fitplan',kind:'log',v:1,cid:s.cid,planId:s.plan.id,name:p.name,exported:Date.now(),start:s.start,logs:s.logs,weights:s.weights,dietLog:s.dietLog},'growfit-report-'+(p.name||'student').replace(/\s+/g,'_')+'-'+iso()+'.json','گزارش '+(p.name||''))};

/* ================= init ================= */
$('#lib').innerHTML=LIB.map(l=>`<option value="${esc(l[0])}">`).join('');
if(DB.role==='student')UI.w=firstOpenWeek();
render(false);
if(typeof window!=='undefined'){
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.screen==='settings'||(DB.role==='student'&&UI.sTab==='me'))render()});
 window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('برنامه نصب شد');render()});
}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
