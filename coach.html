body{padding-top:env(safe-area-inset-top)}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
h3{font-size:15px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.tt{flex:1;min-width:0}
.tt h1{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{color:var(--mut);font-size:13px}
.mk{display:flex;flex:none;width:40px;height:40px;align-items:center;justify-content:center}
.ic{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font-size:18px}
.pad{padding:8px 16px}
.card{background:linear-gradient(160deg,#191919,#111111);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:14px;margin:0 0 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.tap{cursor:pointer}
.card.tap:active{border-color:var(--or)}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 4px}
.f{margin-bottom:10px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font:inherit;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
[data-n],.n{direction:ltr;text-align:center}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 input{padding:8px 4px;font-size:14px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:700;text-align:center;text-decoration:none;margin:0 0 10px;cursor:pointer}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(198,244,50,.25)}
.btn.danger{color:var(--err)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s3);font-size:12px;color:var(--mut)}
.chip.or{background:rgba(198,244,50,.14);color:var(--or2)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tb{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:14px}
.tb.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:700}
.empty{padding:26px 14px;text-align:center;color:var(--mut)}
.empty.sm{padding:12px}
.bar{height:6px;background:var(--s3);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border:0}
.kv small{color:var(--mut);font-weight:400;margin-inline-start:4px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macros div{background:var(--s2);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--mut)}
.macros b{display:block;font-size:17px;color:var(--or2)}
.ex .name{font-weight:700;font-size:16px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.ex .acts{display:flex;gap:6px}
.ex .acts button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx)}
.ex .acts .x{color:var(--err)}
.srow{display:grid;grid-template-columns:minmax(34px,auto) 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.si{color:var(--mut);text-align:center}
.shead{display:grid;grid-template-columns:minmax(34px,auto) 1fr 1fr 46px;gap:8px;font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.ck{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:22px;font-weight:800}
.ck.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(198,244,50,.4)}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.rpe button{padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-weight:700}
.rpe button.on{background:var(--grad);border-color:transparent;color:#fff}
.mrow{display:grid;grid-template-columns:84px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.mrow .nums{text-align:left;direction:ltr;color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:linear-gradient(160deg,#191919,#111111);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:10px 12px}
.tile b{display:block;font-size:19px}
.tile span{font-size:12.5px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:#8d8d9a;font-size:9px}
.scroll{overflow-x:auto}
.heat{border-collapse:collapse;font-size:12px;width:100%}
.heat th{font-weight:600;color:var(--mut);padding:4px 6px;text-align:center;white-space:nowrap}
.heat td{padding:5px 6px;text-align:center;border:1px solid var(--s1);min-width:34px}
.heat tr th:first-child{text-align:right;position:sticky;right:0;background:var(--s1)}
.days{display:flex;gap:6px;margin-top:8px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.days .bar{height:44px;display:flex;align-items:flex-end;margin-bottom:4px;border-radius:8px}
.days .bar i{width:100%}
.mealck{display:flex;gap:12px;align-items:center}
.mealck .ck{flex:none;width:40px;height:40px;font-size:18px}
.note{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.4);color:var(--amb);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.hero{text-align:center;padding:44px 20px 10px;position:relative}
.hero:before{content:'';position:absolute;left:0;right:0;top:-30px;height:280px;background:radial-gradient(closest-side,rgba(198,244,50,.28),transparent);z-index:-1}
.hero svg{width:116px;height:116px}
.hero h1{font-size:38px;margin-top:14px;letter-spacing:.5px}
.hero p{color:var(--mut);margin:6px 0 26px}
#timerpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));background:var(--s3);border:1px solid var(--or);color:var(--tx);border-radius:99px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;z-index:5;font-size:14px}
#timerpill.show{display:flex}
#timerpill.go{background:var(--grad);color:#fff;font-weight:800}
#timerpill button{border:0;border-radius:99px;padding:5px 12px;background:rgba(15,23,31,.35);color:inherit;font:inherit;font-size:12px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);border-radius:12px;padding:9px 18px;font-weight:700;font-size:14px;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.chip.sys{background:transparent;border:1px solid var(--sp,var(--ice));color:var(--sp,var(--ice))}
.card.sk{border-right:3px solid var(--or)}
.card.grp{border-right:3px solid var(--sp,var(--ice))}
.sep{height:1px;background:var(--line);margin:14px 0}
.si small{display:block;font-size:10px;line-height:1.2}
.g5 label{font-size:11px;line-height:1.3;min-height:28px}
.sg{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--s2);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.lnk{background:none;border:0;color:var(--or);font:inherit;font-size:13px;text-decoration:underline;padding:4px 6px}
.fx{background:var(--s2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.fx p{margin:6px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--s1);border-top:1px solid var(--line);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#printroot{display:none}

 @page{size:A4;margin:11mm}
 html,body{background:#fff!important;color:#17222d!important;padding:0!important}

 .pf{margin-top:14px;text-align:center;font-size:10px;color:#8fa2b4}
 .pbrk{break-before:page}
}
.opt{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.opt input,.opt textarea{background:var(--s1)}
.nm{font-weight:700;font-size:16px;background:transparent!important;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.mbi{border-bottom:1px solid var(--line);padding:10px 0}
.mbi:last-child{border:0}
.top.big .tt h1{white-space:normal;font-size:26px;line-height:1.35}
.banner{background:var(--grad);border-radius:22px;padding:16px 18px;margin:8px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;box-shadow:0 12px 28px rgba(198,244,50,.28);cursor:pointer}
.banner b{display:block;font-size:18px;line-height:1.4}.banner span{display:block;font-size:12.5px;opacity:.92}
.banner .go{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-weight:700;flex:none}
.dash{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;padding:0 16px;margin-bottom:14px}
.ringcard{background:linear-gradient(160deg,#1B1B1B,#111111);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:14px 10px 12px;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.ringcard h3{font-size:13.5px;margin:0 6px 6px;text-align:right}
.ring{position:relative;width:100%;max-width:190px;margin:0 auto}
.ring svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 9px rgba(198,244,50,.5))}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.ring .c b{font-size:32px}.ring .c small{color:var(--mut);font-size:11px}
.lvl{display:inline-block;margin-top:3px;padding:0 12px;border-radius:99px;background:rgba(198,244,50,.14);color:var(--or2);font-size:12px}

.wk .wi{width:46px;height:46px;border-radius:14px;background:rgba(198,244,50,.12);color:var(--or);display:flex;align-items:center;justify-content:center;flex:none}
.wk .wi svg{width:24px;height:24px}

.wk .st{margin-inline-start:auto;font-size:12.5px;color:var(--or2);white-space:nowrap}
.wk.done .wi{background:rgba(61,220,151,.14);color:var(--ok)}.wk.done .st{color:var(--ok)}
.trend{margin:0 16px 14px}
.trend .big{font-size:30px;font-weight:800;line-height:1.2}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}

.bn .fab svg{width:30px;height:30px}

.fl{font-size:11.5px;color:var(--mut);margin-top:3px}

.cmp th:first-child{position:sticky;right:0;background:var(--s1);text-align:right;font-weight:600;color:var(--mut)}
.cmp td small{display:block;font-size:11px;line-height:1.3}

.fig{width:100%;max-width:440px;display:block;margin:6px auto}

.heatleg i{width:130px;height:8px;border-radius:9px;background:linear-gradient(270deg,rgba(198,244,50,.16),rgba(198,244,50,1))}
.qrbox{background:#fff;border-radius:16px;padding:10px;max-width:260px;margin:8px auto}
.qrbox svg{display:block;width:100%;height:auto}
#splash{position:fixed;inset:0;z-index:99;background:#0D0D0D;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:spBg .4s ease 2.1s forwards}
.sp-logo{filter:none;animation:spIn .95s cubic-bezier(.05,.72,.1,1) both,spOut .5s cubic-bezier(.6,0,1,.5) 1.75s forwards}
.sp-word{margin-top:16px;font-size:32px;font-weight:800;letter-spacing:.5px;color:#C6F432;opacity:0;animation:spW .5s ease .85s forwards,spOut2 .4s ease 1.8s forwards}
.sp-sub{color:#8A8A8A;font-size:14px;opacity:0;animation:spW .5s ease 1s forwards,spOut2 .4s ease 1.8s forwards}
.sp-streak{position:absolute;top:50%;left:0;height:3px;width:70vw;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(198,244,50,.8),transparent);opacity:0;animation:spS .95s ease-out both}
@keyframes spIn{from{transform:translateX(120vw) skewX(-16deg);opacity:0}12%{opacity:1}to{transform:none;opacity:1}}
@keyframes spOut{to{transform:translateX(-130vw) skewX(16deg);opacity:0}}
@keyframes spW{to{opacity:1}}
@keyframes spOut2{to{opacity:0;transform:translateX(-30vw)}}
@keyframes spBg{to{opacity:0;visibility:hidden}}
@keyframes spS{0%{transform:translateX(110vw);opacity:.9}100%{transform:translateX(-20vw);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash{animation:spBg .3s ease .7s forwards}.sp-logo,.sp-word,.sp-sub{animation:none;opacity:1;transform:none}.sp-streak{display:none}}

.wml{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.wmvs{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.wmvs:last-child{border-bottom:0}
.wmvs span{color:var(--mut);font-size:14px}
.blkrow{display:flex;align-items:center;gap:10px;margin-top:10px}

.blkrow select{flex:1}
/* ===== live timer ===== */
body.lvon{overflow:hidden}
body.lvon #app,body.lvon nav{visibility:hidden}
.lvp{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 50% -10%,rgba(198,244,50,.35),transparent 60%),#0E0E0E;color:#fff;font-family:var(--font);transition:background .35s}
.lvp.ph-prep{background:radial-gradient(1200px 700px at 50% -10%,rgba(251,191,36,.28),transparent 60%),#1B1B1B}
.lvp.ph-work{background:radial-gradient(1200px 700px at 50% -10%,rgba(52,211,153,.32),transparent 60%),#06150f}
.lvp.ph-rest{background:radial-gradient(1200px 700px at 50% -10%,rgba(34,211,238,.28),transparent 60%),#06141a}
.lvp.ph-done{background:radial-gradient(1200px 700px at 50% -10%,rgba(198,244,50,.4),transparent 60%),#161616}
.lv-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.lv-tt{flex:1;min-width:0;display:flex;flex-direction:column}
.lv-tt b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-tt span{font-size:12px;color:rgba(255,255,255,.7)}
.lv-clock{font-size:15px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8);direction:ltr}
.lv-ib{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer}
.lv-main{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:10px;padding:0 14px;overflow:auto}
.lv-media{display:flex;justify-content:center;max-height:28vh}
.lv-media img,.lv-media video{max-height:28vh;max-width:100%;border-radius:16px;object-fit:contain}
.lv-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lv-phase{font-size:20px;font-weight:800;letter-spacing:.04em;opacity:.9}
.lv-time{font-size:clamp(88px,30vw,220px);font-weight:800;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.4)}
.lv-name{font-size:clamp(26px,7vw,56px);font-weight:800}
.lv-reps{font-size:clamp(18px,4.5vw,32px);color:rgba(255,255,255,.85)}
.lv-cue{font-size:15px;color:rgba(255,255,255,.7)}
.lv-side{display:flex;flex-direction:column;gap:6px;align-items:center}
.lv-chip{padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:700;font-size:15px}
.lv-chip:empty{display:none}
.lv-next small{display:block;color:rgba(255,255,255,.6);font-size:12px}
.lv-next b{font-size:18px}
.lv-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lv-list div{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.7)}
.lv-list div.on{background:#fff;color:#0E0E0E;font-weight:700}
.lv-prog{height:6px;background:rgba(255,255,255,.12);margin:8px 14px;border-radius:9px;overflow:hidden}
.lv-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C6F432,#22d3ee);border-radius:9px}
.lv-ctl,.lv-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 14px 18px}
.lv-b{padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.lv-b.pri{background:linear-gradient(135deg,#C6F432,#C6F432);border-color:transparent;box-shadow:0 10px 30px rgba(198,244,50,.4)}
.lv-b:disabled{opacity:.4}
.lv-ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:14px;overflow:auto}
.lv-big{font-size:clamp(70px,22vw,180px);font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;line-height:1}
.lv-set{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lv-set label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:rgba(255,255,255,.7);text-align:right}
.lv-set select,.lv-set input{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px;font:inherit}
.lv-hint{max-width:520px;font-size:13px;color:rgba(255,255,255,.65);line-height:1.9}
.lv-mv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lv-mv div{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;flex-direction:column}
.lv-mv span{font-size:12px;color:rgba(255,255,255,.7)}
/* TV / big screen */
.lv-time,.lv-big{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;font-weight:800;letter-spacing:.02em}
.lv-time{font-size:min(34vw,26vh)}
.lvp.tv .lv-top{padding:22px 40px}.lvp.tv .lv-tt b{font-size:30px}.lvp.tv .lv-clock{font-size:30px}
.lvp.tv .lv-time{font-size:min(40vw,44vh)}
.lvp.tv .lv-name{font-size:clamp(40px,6vw,110px)}.lvp.tv .lv-reps{font-size:clamp(26px,3.4vw,60px)}.lvp.tv .lv-phase{font-size:clamp(28px,3vw,52px)}
.lvp.tv .lv-chip{font-size:clamp(20px,2vw,34px);padding:6px 24px}.lvp.tv .lv-next b{font-size:clamp(24px,2.4vw,44px)}.lvp.tv .lv-list div{font-size:clamp(16px,1.6vw,28px);padding:6px 18px}
.lvp.tv .lv-ctl{opacity:.25;transition:opacity .3s}.lvp.tv .lv-ctl:hover{opacity:1}
@media(min-width:900px){
 .lv-main{grid-template-columns:1fr;grid-template-rows:1fr auto;padding:0 30px}
 .lv-main.hm{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);grid-template-rows:1fr auto}
 .lv-main .lv-media{display:none}.lv-main.hm .lv-media{display:flex;max-height:56vh}.lv-main.hm .lv-media img,.lv-main.hm .lv-media video{max-height:56vh}

}
@media(max-width:899px){.lv-main .lv-media:empty{display:none}}
@media(max-height:520px) and (orientation:landscape){.lv-time{font-size:42vh}.lv-media{display:none}.lv-name{font-size:6vh}}
/* editor */
.lvcard .chip{margin-inline-end:4px}.lvst{border-inline-start:3px solid var(--or)}.lvth{width:64px;height:64px;object-fit:cover;border-radius:10px}.lvmed{display:flex;gap:8px;align-items:center;margin:6px 0}
.lvbtns{margin:8px 0 0}
.sw2{display:flex;align-items:center;gap:8px}
@font-face{font-family:"Vazirmatn";font-weight:400;font-display:swap;src:local("Vazirmatn"),local("Vazirmatn Regular"),url("fonts/Vazirmatn-Regular.woff2") format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:700;font-display:swap;src:local("Vazirmatn Bold"),url("fonts/Vazirmatn-Bold.woff2") format("woff2")}
:root{--bg:#0D0D0D;--s1:#141414;--s2:#1A1A1A;--s3:#222222;--line:rgba(255,255,255,.07);--tx:#FFFFFF;--mut:#8A8A8A;--or:#C6F432;--or2:#D7FA5E;--ice:#38BDF8;--amb:#FFB020;--ok:#22C55E;--err:#FF5C5C;--vio:#C6F432;--pink:#C6F432;--grad:#C6F432;--grad2:#C6F432;--glass:#141414;--glow:none;--font:Vazirmatn,"IRANSansX","IRANSans","Shabnam","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
/* ===== GrowFit v6 theme: violet dashboard ===== */
html{background:#0E0E0E}
body{background:
 radial-gradient(900px 520px at 100% -8%,rgba(198,244,50,.38),transparent 62%),
 radial-gradient(700px 480px at -10% 40%,rgba(198,244,50,.22),transparent 60%),
 radial-gradient(800px 500px at 60% 115%,rgba(198,244,50,.2),transparent 60%),#0E0E0E;
 background-attachment:fixed;font-family:var(--font);font-size:15px;line-height:1.75;font-feature-settings:"ss01" 0}
body,button,input,select,textarea{font-family:var(--font)}
.card,.tile,.wk,.ringcard,.opt,.sg{background:linear-gradient(160deg,rgba(59,59,59,.62),rgba(26,26,26,.82));border:1px solid var(--line);box-shadow:0 10px 30px rgba(16,16,16,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.opt,.sg,.fx{background:rgba(53,53,53,.45)}
.card.tap:active{border-color:var(--or2)}
input,select,textarea{background:rgba(38,38,38,.85);border-color:rgba(198,244,50,.28)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline-color:var(--or2)}
.btn{background:rgba(53,53,53,.7);border-color:rgba(198,244,50,.35)}
.btn.pri{background:var(--grad);box-shadow:0 10px 26px rgba(198,244,50,.42)}
.btn.sm{border-radius:10px}
.chip{background:rgba(198,244,50,.16);color:#D8D8D8}
.chip.or{background:rgba(198,244,50,.2);color:var(--or2)}
.tb{background:rgba(38,38,38,.8);border-color:rgba(198,244,50,.3)}
.tb.on{box-shadow:0 6px 18px rgba(198,244,50,.4)}
.ic{background:rgba(38,38,38,.8);border-color:rgba(198,244,50,.3);border-radius:14px}
.bar{background:rgba(198,244,50,.18)}
.ck.on,.rpe button.on{box-shadow:0 4px 14px rgba(198,244,50,.5)}
.heatleg i{background:linear-gradient(270deg,#C6F432,#C6F432,#f97316)}
.chart text{fill:#AAAAAA}
.sheet>div{background:#1A1A1A;border-color:var(--line)}
.top{padding:18px 16px 8px}
.tt h1{font-size:22px}
#toast{background:#F9F9F9;color:#1A1A1A}
/* bottom nav */
.bn{background:rgba(26,26,26,.94);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -10px 34px rgba(16,16,16,.6);backdrop-filter:blur(10px)}
.bn .fab{background:var(--grad);box-shadow:0 10px 28px rgba(198,244,50,.55)}
.bn>button.on{color:var(--or2)}
.banner{background:var(--grad);box-shadow:0 12px 30px rgba(198,244,50,.35)}
.ring svg{filter:drop-shadow(0 0 10px rgba(198,244,50,.55))}
.lvl{background:rgba(198,244,50,.2)}
.wk .wi{background:rgba(198,244,50,.18)}
.avatar{background:var(--grad)}
.hero:before{background:radial-gradient(closest-side,rgba(198,244,50,.32),transparent)}
/* ---------- dashboards ---------- */
.dsh{display:grid;grid-template-columns:1fr;gap:14px;padding:6px 16px 10px}
.dsh>*{min-width:0}
.dsh .card,.dsh .dcard{margin:0}
.dcard{background:linear-gradient(160deg,rgba(59,59,59,.62),rgba(26,26,26,.82));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(16,16,16,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dh h3{margin:0;font-size:17px;font-weight:800}
.dlink{background:rgba(38,38,38,.7);border:1px solid rgba(198,244,50,.45);color:#fff;border-radius:99px;padding:3px 14px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.dlink:hover{background:rgba(198,244,50,.35)}
.d-hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(26,26,26,.95) 0%,rgba(198,244,50,.75) 60%,rgba(198,244,50,.55) 100%);padding:22px 20px;min-height:200px;display:flex;align-items:center;box-shadow:0 14px 40px rgba(16,16,16,.55)}
.d-hero .tx{position:relative;z-index:2;max-width:62%}
.d-hero h2{font-size:clamp(24px,5vw,34px);font-weight:800;margin:0 0 4px;line-height:1.35}
.d-hero p{font-size:clamp(15px,3vw,20px);color:#EEEEEE;margin:0 0 16px}
.d-cta{display:inline-flex;align-items:center;gap:10px;background:var(--grad);border:0;color:#fff;border-radius:16px;padding:12px 24px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 28px rgba(198,244,50,.55)}
.d-cta i{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#fff;color:#C6F432;align-items:center;justify-content:center}
.d-cta svg{width:14px;height:14px;fill:currentColor;stroke:none}
.d-hero small{display:block;margin-top:10px;color:#DCDCDC;font-size:12.5px}
.d-art{position:absolute;inset-block:0;inset-inline-end:0;width:48%;z-index:1;opacity:.95;pointer-events:none}
.d-art svg{width:100%;height:100%}
.d-prog{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.d-ring{position:relative;width:150px;height:150px}
.d-ring svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(198,244,50,.55))}
.d-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d-ring .c b{font-size:34px;font-weight:800;line-height:1}
.d-ring .c small{font-size:11.5px;color:var(--mut);margin-top:4px}
.d-ring .lvlb{margin-top:6px;font-size:12px;color:#fcd34d}
.pstats{display:flex;flex-direction:column;gap:12px;border-inline-start:1px solid var(--line);padding-inline-start:16px}
.ps{display:flex;align-items:center;gap:12px}
.ps .pi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(198,244,50,.18);color:#D7FA5E}
.ps .pi svg{width:22px;height:22px}
.ps .pi.fl{color:#fb923c;background:rgba(251,146,60,.14)}.ps .pi.tr{color:#fbbf24;background:rgba(251,191,36,.14)}
.ps b{display:block;font-size:19px;line-height:1.2}.ps span{font-size:12.5px;color:var(--mut)}
.d-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dt{position:relative;border-radius:20px;padding:14px;border:1px solid var(--line);overflow:hidden;cursor:pointer;background:linear-gradient(160deg,rgba(59,59,59,.55),rgba(21,21,21,.9))}
.dt .ti{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(198,244,50,.22);color:#D9D9D9;margin-bottom:8px}
.dt .ti svg{width:23px;height:23px}
.dt span{display:block;font-size:13px;color:#DCDCDC}
.dt b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.dt em{font-style:normal;font-size:12px;color:#34d399;display:block}
.dt em.dn{color:#fb7185}
.dt svg.sp{position:absolute;inset-inline-start:10px;bottom:10px;width:46%;height:42px;opacity:.95}
.dt.t2 .ti{background:rgba(34,211,238,.16);color:#22d3ee}.dt.t3 .ti{background:rgba(52,211,153,.16);color:#34d399}.dt.t4 .ti{background:rgba(251,191,36,.16);color:#fbbf24}
.d-rec{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rw{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:rgba(21,21,21,.7);cursor:pointer;display:flex;flex-direction:column}
.rw .th{height:92px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#C6F432,#C6F432 55%,#C6F432)}
.rw:nth-child(2) .th{background:linear-gradient(135deg,#0e3a5c,#2563eb 55%,#22d3ee)}
.rw:nth-child(3) .th{background:linear-gradient(135deg,#3F3F3F,#C6F432 55%,#D7FA5E)}
.rw .th svg{width:44px;height:44px;opacity:.9}
.rw .th:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 18px)}
.rw .pl{position:absolute;inset-inline-end:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(14,14,14,.7);display:flex;align-items:center;justify-content:center;z-index:2}
.rw .pl svg{width:12px;height:12px;fill:#fff;stroke:none;opacity:1}
.rw .in{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.rw b{display:block;font-size:14.5px;line-height:1.4}.rw small{color:var(--mut);font-size:12px}
.rw .ok{width:24px;height:24px;border-radius:7px;background:#C6F432;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.rw .ok svg{width:15px;height:15px}.rw .ok.off{background:rgba(198,244,50,.2);color:#9E9E9E}
.d-nut{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.d-nut .d-ring{width:118px;height:118px}.d-nut .d-ring .c b{font-size:24px}
.mac{display:flex;flex-direction:column;gap:9px}
.mac div{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(198,244,50,.18);padding-bottom:6px;font-size:13.5px}
.mac div:last-child{border:0}
.mac i{width:10px;height:10px;border-radius:50%;flex:none}.mac b{margin-inline-start:auto;direction:ltr;font-size:13.5px}
.tipbox{grid-column:1/-1;display:flex;gap:10px;align-items:center;background:rgba(198,244,50,.16);border:1px solid rgba(198,244,50,.3);border-radius:14px;padding:10px 12px;font-size:13px;color:#EEEEEE}
.d-week .bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px;padding-top:8px}
.d-week .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.d-week .bc i{display:block;width:min(34px,70%);border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#C6F432,#C6F432);min-height:8px;box-shadow:0 0 14px rgba(198,244,50,.4)}
.d-week .bc.z i{background:rgba(198,244,50,.22);box-shadow:none}
.d-week .bc.td i{background:linear-gradient(180deg,#D9D9D9,#C6F432)}
.d-week .bc span{font-size:12px;color:var(--mut)}
.d-leg{font-size:12.5px;color:#DCDCDC;display:flex;align-items:center;gap:6px}.d-leg:before{content:'';width:8px;height:8px;border-radius:50%;background:#C6F432}
.d-ban{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(198,244,50,.55);padding:18px;background:linear-gradient(120deg,rgba(198,244,50,.85),rgba(26,26,26,.95));display:flex;align-items:center;gap:14px;min-height:140px;box-shadow:0 12px 34px rgba(198,244,50,.45)}
.d-ban .bi{font-size:42px;line-height:1;color:#fbbf24;filter:drop-shadow(0 0 12px rgba(251,191,36,.6));flex:none}
.d-ban .bi svg{width:46px;height:46px;fill:#fbbf24;stroke:none}
.d-ban h3{font-size:19px;margin:0 0 2px}.d-ban p{font-size:13px;color:#E6E6E6;margin:0 0 10px}
.d-ban .go2{background:linear-gradient(135deg,#C6F432,#C6F432);border:0;color:#fff;border-radius:12px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.d-sub{border-radius:22px;border:1px solid rgba(198,244,50,.5);background:linear-gradient(160deg,rgba(198,244,50,.45),rgba(26,26,26,.9));padding:14px;text-align:center}
/* coach dashboard */
.cl-grid{display:grid;grid-template-columns:1fr;gap:12px}
.cl-grid>.card{margin:0}
.dsh .acts-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

 #side{position:fixed;z-index:30;inset-block:16px;inset-inline-start:16px;width:262px;flex-direction:column;background:linear-gradient(180deg,rgba(38,38,38,.9),rgba(17,17,17,.94));border:1px solid var(--line);border-radius:28px;padding:22px 14px 14px;box-shadow:0 20px 60px rgba(16,16,16,.65);overflow:auto}

 #side nav button svg{width:22px;height:22px;flex:none}
 #side nav button:hover{background:rgba(198,244,50,.18)}

 #side .sp1{flex:1;min-height:14px}
 #side .upg{border:1px solid rgba(198,244,50,.5);border-radius:18px;padding:14px 12px;text-align:center;background:linear-gradient(160deg,rgba(198,244,50,.45),rgba(26,26,26,.9));margin-bottom:12px}
 #side .upg svg{width:30px;height:30px;color:#fbbf24;fill:#fbbf24;stroke:none}
 #side .upg b{display:block;color:#fcd34d;font-size:14.5px}#side .upg small{display:block;color:#DCDCDC;font-size:12px;margin:4px 0 8px}
 #side .upg button{background:var(--grad);border:0;color:#fff;border-radius:10px;padding:6px 18px;font:inherit;font-weight:700;cursor:pointer;font-size:13px}
 #side .usr{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 6px 0;cursor:pointer}
 #side .usr .avatar{width:40px;height:40px;font-size:16px}
 #side .usr b{display:block;font-size:14px}#side .usr small{color:var(--mut);font-size:12px}
 #tbar{position:fixed;z-index:29;top:16px;inset-inline-start:306px;inset-inline-end:28px;height:60px;align-items:center;gap:14px}
 #tbar .sr{position:relative;flex:0 1 520px}
 #tbar .sr input{height:52px;border-radius:99px;padding-inline-start:48px;background:rgba(38,38,38,.8);border:1px solid var(--line);font-size:15px}
 #tbar .sr svg{position:absolute;inset-inline-start:16px;top:15px;width:22px;height:22px;color:#D7FA5E;pointer-events:none}
 #tbar .res{position:absolute;top:58px;inset-inline:0;background:#1A1A1A;border:1px solid var(--line);border-radius:18px;padding:6px;max-height:60vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);display:none}
 #tbar .res.on{display:block}
 #tbar .res button{display:flex;gap:10px;align-items:center;width:100%;background:transparent;border:0;color:#fff;font:inherit;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:start}
 #tbar .res button:hover{background:rgba(198,244,50,.25)}
 #tbar .res small{color:var(--mut);margin-inline-start:auto}
 #tbar .res p{padding:10px 12px;color:var(--mut);margin:0;font-size:13px}
 #tbar .sp2{flex:1}
 #tbar .bl{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer}
 #tbar .bl svg{width:28px;height:28px}
 #tbar .bl i{position:absolute;top:2px;inset-inline-end:2px;min-width:20px;height:20px;border-radius:99px;background:#C6F432;color:#fff;font-size:12px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}
 #tbar .bp{position:absolute;top:56px;inset-inline-end:60px;width:300px;background:#1A1A1A;border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:none}
 #tbar .bp.on{display:block}
 #tbar .bp button{display:block;width:100%;text-align:start;background:transparent;border:0;color:#fff;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer}
 #tbar .bp button:hover{background:rgba(198,244,50,.25)}
 #tbar .bp p{margin:0;padding:10px;color:var(--mut);font-size:13px}
 #tbar .av{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#fff;cursor:pointer;font:inherit}
 #tbar .av .avatar{width:48px;height:48px}
}

@media (max-width:420px){
 .d-prog{grid-template-columns:1fr;justify-items:center}.pstats{border:0;padding:0;width:100%}
 .d-hero .tx{max-width:70%}.d-hero{min-height:180px}
 .d-rec{grid-template-columns:1fr}
 .rw{flex-direction:row}.rw .th{width:96px;height:auto;min-height:74px;flex:none}.rw .in{flex:1}

@media print{#side,#tbar{display:none!important}}
.top.big .tt h1{font-size:22px}
@media (max-width:1023px){.top.big .tt{display:none}.top.big{justify-content:space-between}}
@media (min-width:1024px){body.sh .top.big{display:none}}
.d-art{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 38%);mask-image:linear-gradient(to left,transparent 0,#000 38%)}
.dt{min-height:118px}
@media (min-width:1024px){body.sh #app>.pad,body.sh #app>.top,body.sh #app>.strip,body.sh #app>.banner{margin-inline:auto}}
/* toggle switch */
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none;margin:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(198,244,50,.22);border:1px solid var(--line);transition:background .2s}
.sw i:after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#DCDCDC;transition:transform .2s,background .2s}
.sw input:checked+i{background:var(--grad);border-color:transparent}
.sw input:checked+i:after{background:#fff;transform:translateX(-20px)}
.sw input:focus-visible+i{outline:2px solid var(--or2);outline-offset:2px}
.sw2{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx);margin:8px 0}
.sw2 input{width:20px;height:20px;flex:none;accent-color:#C6F432;padding:0}
.sprow{padding:12px 14px}
.sprow input[type=text],.sprow input:not([type]),.sprow input[type=time]{margin-top:2px}
/* ===== GrowFit "PowerFit Lime" (v8) =====
   Flat, opaque, matte. One neon-lime accent (#C6F432) on near-black. Text on lime is always #0D0D0D.
   Only appearance changes: no feature, data, key or function was touched.
   HERO IMAGE SLOT: put a real athlete photo in the dashboard hero by setting  --hero-img:url("hero.jpg")  on :root below
   (any dark photo works; the bottom fade keeps the text readable). */
:root{--hero-img:none;--lime-t:rgba(198,244,50,.12);--lime-b:rgba(198,244,50,.35);--ink:#0D0D0D;--dim:#6B6B6B;color-scheme:dark}
html,body{background:var(--bg);color:var(--tx)}
body{font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:800;line-height:1.3;letter-spacing:0}
.acc{color:var(--or)}
.num,.d-ring .c b,.dt b,.ps b,.mac b{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* ---------- surfaces: flat cards ---------- */
.card,.dcard,.tile,.wk,.ringcard,.rc,.opt,.sg,.sprow{background:var(--s2);border:1px solid var(--line);border-radius:20px;box-shadow:none}
.card{padding:16px;margin-bottom:12px}
.opt{border-radius:16px}
.fx,.macros div,.tipbox{background:var(--s3);border:1px solid var(--line);box-shadow:none}
.card.tap,.dt,.rw,.qa,.btn,.tb,.ic,.ck{transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease}
.card.tap:active,.dt:active,.rw:active,.qa:active,.btn:active,.tb:active,.ic:active{transform:scale(.97)}
.card.tap:hover,.dt:hover,.qa:hover{border-color:var(--lime-b)}
.card.sk,.card.grp{border-inline-start:3px solid var(--sp,var(--or));border-right-width:1px}
.card.sk,.card.grp{border-right:1px solid var(--line);border-left-width:1px;border-inline-start:3px solid var(--sp,var(--or))}
.kv{border-bottom:1px solid var(--line)}
.empty{color:var(--mut)}
/* ---------- buttons ---------- */
.btn{border-radius:999px;background:var(--s3);border:1px solid var(--line);color:var(--tx);font-weight:700;box-shadow:none;min-height:48px}
.btn.sm{border-radius:999px;min-height:44px;min-width:44px}
.btn.danger{color:var(--err);border-color:rgba(255,92,92,.4);background:transparent}
.btn.pri,.d-cta,.banner,.tb.on,.ck.on,.rpe button.on,.d-ban .go2,#side .upg button,.fab{background:var(--or);color:var(--ink);border-color:var(--or);font-weight:800;box-shadow:none}
.btn.pri:hover,.d-cta:hover{background:var(--or2);border-color:var(--or2)}
.btn.pri{box-shadow:0 6px 20px rgba(198,244,50,.18)}
.banner{border-radius:20px}
.banner span,.banner small,.banner p{color:rgba(13,13,13,.8)}
.banner .go{background:var(--ink);color:var(--or);border-radius:999px;min-height:44px}
.tb{border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--tx);min-height:44px}
.rpe button{border-radius:14px;background:var(--s3);border-color:var(--line);min-height:48px}
.ic{width:44px;height:44px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--tx)}
.ck{border:2px solid #555;background:transparent;color:transparent}
.ck.on{color:var(--ink);border-color:var(--or)}
.dlink{background:transparent;border:0;color:var(--or);padding:6px 0;font-size:13px;font-weight:700;border-radius:0;text-decoration:none}
.dlink:hover{background:transparent;color:var(--or2)}
.lnk,.sec button{color:var(--or)}
/* ---------- inputs ---------- */
input,select,textarea{background:var(--s3);border:1px solid var(--line);border-radius:14px;min-height:46px;color:var(--tx);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(198,244,50,.22)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input::placeholder,textarea::placeholder{color:#7A7A7A}
input[type=checkbox],input[type=radio],.sw2 input{accent-color:var(--or)}
label{color:var(--mut)}
/* ---------- chips, bars, notes ---------- */
.chip{background:rgba(255,255,255,.06);color:#BDBDBD;border-radius:12px;border:0}
.chip.or,.lvl{background:var(--lime-t);color:var(--or);box-shadow:none}
.chip.sys{background:transparent;border:1px solid var(--sp,var(--or));color:var(--sp,var(--or))}
.bar,.prog i{background:rgba(255,255,255,.08);box-shadow:none}
.bar i,.prog i.on{background:var(--or)}
.note,.info{background:var(--s2);border:1px solid var(--line);border-inline-start:3px solid var(--or);border-radius:14px;color:var(--tx);box-shadow:none}
.note{border-inline-start-color:var(--amb);color:#FFD27A}
.note.warn,.card .note{background:rgba(255,176,32,.08)}
.sw i{background:#2A2A2A;border:1px solid var(--line)}
.sw i:after{background:#9A9A9A}
.sw input:checked+i{background:var(--or);border-color:var(--or)}
.sw input:checked+i:after{background:var(--ink)}
.avatar{background:var(--s3);color:var(--or);border:1px solid var(--line)}
.heatleg i{background:linear-gradient(270deg,#F5FFD0,#C6F432 55%,#262626)}
.chart text{fill:#8A8A8A}
.chart line,.chart .grid{stroke:rgba(255,255,255,.06)}
/* ---------- bars, rings (dashboard) ---------- */
.dsh{gap:12px;padding:6px 16px 10px}
.dcard{border-radius:20px;padding:16px;box-shadow:none}
.dh h3{font-size:17px;font-weight:800;color:var(--tx)}
.d-hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:#141414 var(--hero-img) center/cover no-repeat;min-height:260px;padding:20px;align-items:flex-end;box-shadow:none}
.d-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(to top,#0D0D0D 8%,transparent 70%);z-index:1;pointer-events:none}
.d-hero .tx{position:relative;z-index:2;max-width:100%;width:100%}
.d-hero h2{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.25;margin:0 0 8px;color:#fff}
.d-hero h2 .acc{display:block;color:var(--or)}
.d-hero p{font-size:14px;color:var(--mut);margin:0 0 14px}
.d-hero small{display:block;margin-top:10px;font-size:12.5px;color:var(--mut)}
.d-art{inset-inline-end:0;width:55%;opacity:.5;filter:grayscale(.55);-webkit-mask-image:linear-gradient(to left,transparent 0,#000 40%);mask-image:linear-gradient(to left,transparent 0,#000 40%)}
.d-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:360px;height:56px;padding:0 8px;border:0;border-radius:999px;font-size:16px;cursor:pointer}
.d-cta i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--or);flex:none}
.d-cta i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.d-cta span{flex:1;text-align:center}
.d-cta>svg{width:18px;height:18px;flex:none;margin-inline-end:10px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.d-ring svg{filter:none}
.d-ring circle:nth-of-type(1){stroke:rgba(255,255,255,.08)}
.d-ring circle:nth-of-type(2){stroke:var(--or)}
.d-ring .c b{font-size:30px;font-weight:800;color:#fff}
.d-ring .c small{font-size:11.5px;color:var(--mut)}
.d-ring .lvlb{color:var(--or)}
.pstats{border-inline-start:1px solid var(--line)}
.ps .pi,.ps .pi.fl,.ps .pi.tr{background:var(--lime-t);color:var(--or);width:36px;height:36px;border-radius:12px}
.ps .pi svg{width:20px;height:20px;stroke-width:1.75}
.ps b{font-size:19px;font-weight:800;color:#fff}.ps span{color:var(--mut);font-size:12.5px}
.dt{background:var(--s2);border:1px solid var(--line);border-radius:18px;box-shadow:none}
.dt .ti,.dt.t2 .ti,.dt.t3 .ti,.dt.t4 .ti{background:var(--lime-t);color:var(--or);border-radius:12px}
.dt span{color:var(--mut)}
.dt b{font-size:26px;font-weight:800;color:#fff}
.dt em{color:var(--ok)}.dt em.dn{color:var(--err)}
.d-rec{gap:10px}
.rw{position:relative;flex-direction:row;align-items:center;border-radius:18px;background:var(--s2);border:1px solid var(--line);overflow:hidden;min-height:76px}
.rw .th{order:-1;width:84px;height:auto;min-height:76px;align-self:stretch;flex:none;background:var(--s3)!important;color:#555}
.rw .th:after{background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 14px)}
.rw .th svg{color:#6B6B6B;opacity:1}
.rw .in{flex:1;padding:10px 12px;padding-inline-end:64px}
.rw b{color:#fff}.rw small{color:var(--mut)}
.rw .pl{position:absolute;inset-inline-end:12px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;background:var(--or);z-index:3}
.rw .pl svg{width:14px;height:14px;fill:var(--ink);stroke:none;opacity:1;color:var(--ink);transform:none}
.rw .ok{position:absolute;inset-inline-end:12px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;background:var(--or);color:var(--ink);border:0}
.rw .ok.off{background:transparent;border:1.5px solid #555;color:transparent;display:none}
.rw.dn .pl{display:none}
.rw .ok svg{width:16px;height:16px;stroke-width:2.6}
.d-nut-c .mac i{border-radius:50%}
.mac div{border-bottom:1px solid var(--line)}
.mac b{color:#fff}
.tipbox{background:var(--s3);border:1px solid var(--line);border-inline-start:3px solid var(--or);border-radius:14px;color:#D0D0D0}
.d-week .bc i{background:var(--or);box-shadow:none;border-radius:8px}
.d-week .bc.z i{background:#2A2A2A}
.d-week .bc.td i{background:var(--or2)}
.d-week .bc span{color:var(--mut)}
.d-leg:before{background:var(--or)}
.d-ban{background:var(--s2);border:1px solid var(--line);border-inline-start:3px solid var(--or);border-radius:20px;box-shadow:none}
.d-ban .bi,.d-ban .bi svg{color:var(--or);fill:var(--or);filter:none}
.d-ban p{color:var(--mut)}
.d-ban .go2{border-radius:999px;padding:10px 20px;min-height:44px}
.d-sub{background:var(--s2);border:1px solid var(--line);border-radius:20px}
.qa{background:var(--s2);border:1px solid var(--line);border-radius:18px;color:#fff;aspect-ratio:1/.95;justify-content:center}
.qa svg{color:var(--or);stroke-width:1.75}
/* ---------- bottom navigation ---------- */
.bn{background:var(--s1);border:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:none;padding:10px 6px calc(18px + env(safe-area-inset-bottom));max-width:560px}
.bn:after{content:'';position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));width:120px;height:4px;margin-left:-60px;border-radius:4px;background:#2A2A2A}
.bn>button{color:var(--dim);font-size:10.5px;min-height:52px}
.bn>button svg{stroke-width:1.75}
.bn>button.on{color:var(--or);font-weight:700}
.bn .fab{width:56px;height:56px;margin:-24px 0 0;border:0;border-radius:50%;background:var(--or);color:var(--ink);box-shadow:0 0 0 6px var(--bg)}
.bn .fab svg{stroke:var(--ink);stroke-width:2}
.bn .fab.on{outline:0;box-shadow:0 0 0 6px var(--bg),0 0 0 8px rgba(198,244,50,.4)}
.bn .fl{color:var(--dim);font-size:10.5px}
#app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
/* ---------- overlays ---------- */
.sheet>div,#side,#tbar .res,#tbar .bp,#timerpill{background:var(--s1);border:1px solid var(--line);box-shadow:none}
.sheet>div{border-radius:24px 24px 0 0}
.sheet{background:rgba(0,0,0,.7)}
#toast{background:#FFFFFF;color:var(--ink);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-weight:700}
#timerpill{border-color:var(--or);color:#fff}
#timerpill.go{background:var(--or);color:var(--ink)}
/* ---------- welcome / lock screens ---------- */
#app>.hero:first-child{display:flex;flex-direction:column;align-items:flex-start;text-align:start;min-height:calc(100dvh - 250px);padding:calc(28px + env(safe-area-inset-top)) 22px 8px}
#app>.hero:first-child:before{display:none}
#app>.hero:first-child>svg{width:44px;height:44px;margin-bottom:auto}
#app>.hero:first-child>svg path{fill:var(--or)}
#app>.hero:first-child h1{font-size:clamp(44px,14vw,68px);line-height:1.1;margin:24px 0 6px;font-weight:800;color:#fff}
#app>.hero:first-child h1 b{color:var(--or)}
#app>.hero:first-child p{color:var(--mut);font-size:14px;margin:0 0 18px}
#app>.hero:first-child+.pad .btn.pri{height:56px;font-size:16px}
.top .mk svg path{fill:var(--or)}
.top{padding:16px 16px 8px}.tt h1{font-size:22px;font-weight:800}.top.big .tt h1{font-size:26px}
.tt p{color:var(--mut)}
.strip{scrollbar-width:none}
/* ---------- tables ---------- */
.cmp th{color:var(--mut);font-weight:600;border-bottom:1px solid var(--line)}
.cmp td{border-bottom:1px solid var(--line)}
.cmp .tot,.cmp tr.tot td{background:rgba(198,244,50,.06)}
.cmp td:first-child,.cmp th:first-child{background:var(--s1)}
/* ---------- desktop shell ---------- */
@media (min-width:1024px){

function itClean(raw){
 try{

   age:itRange(a.age,...IT_LIM.age),height:itRange(a.height,...IT_LIM.height),weight:itRange(a.weight,...IT_LIM.weight),

   act:IT_ACT[itEn(a.act)]?String(itEn(a.act)):'',goal:IT_GOAL[a.goal]?a.goal:'',stress:IT_STRESS[a.stress]?a.stress:'',
   trainHist:itStr(a.trainHist,500),dietHist:itStr(a.dietHist,500),job:itStr(a.job,120),illness:itStr(a.illness,500),injury:itStr(a.injury,500),
   meds:itStr(a.meds,500),sleep:itTime(a.sleep),wake:itTime(a.wake),mealLimit:itStr(a.mealLimit,300),anomOther:itStr(a.anomOther,300),
   sport:/^[a-z][a-z0-9]{1,5}$/.test(a.sport||'')?a.sport:'',sportN:itStr(a.sportN,40),sportRec:(Array.isArray(a.sportRec)?a.sportRec:[]).filter(x=>/^[a-z][a-z0-9]{1,5}$/.test(x)).slice(0,3),
   anoms:[],pkg:itStr(a.pkg,40),code:itStr(a.code,24).toUpperCase().replace(/\s+/g,''),consent:null};
  (Array.isArray(a.anoms)?a.anoms:[]).forEach(x=>{x=parseInt(itEn(x),10);if(IT_ANOMS[x]&&o.anoms.indexOf(x)<0)o.anoms.push(x)});
  o.anoms.sort((p,q)=>p-q);

   const c=a.consent&&typeof a.consent==='object'?a.consent:{},p={};
   IT_PARQ.forEach((q,i)=>{const v=c.parq&&c.parq['p'+(i+1)];p['p'+(i+1)]=v==='y'?'y':v==='n'?'n':''});
   const ts=Number(c.ts);
   o.consent={agree:c.agree===true,sig:itStr(c.sig,60),ts:ts>1.6e12&&ts<Date.now()+864e5*2?ts:0,parq:p};
   if(!o.consent.agree||o.consent.sig.length<3)return{ok:false,err:'رضایت‌نامه تأیید یا امضا نشده است'};
   if(Object.keys(p).some(k=>!p[k]))return{ok:false,err:'پاسخ پرسش‌های سلامت کامل نیست'};
  }
  if(!o.name)return{ok:false,err:'نام در فرم نیست'};
  if(o.age===''||o.height===''||o.weight===''||!o.sex)return{ok:false,err:'سن، قد، وزن یا جنسیت در فرم نیست یا خارج از محدوده است'};
  const created=Number(raw.created),now=Date.now();
  const cr=created>1.6e12&&created<now+864e5*2?created:now;
  let d=/^\d{4}-\d{2}-\d{2}$/.test(String(raw.d))?String(raw.d):'';
  if(!d||Math.abs(new Date(d+'T12:00:00')-cr)>864e5*3)d=itIso(new Date(cr));
  const c=raw.coach&&typeof raw.coach==='object'?raw.coach:{};
  return{ok:true,data:{v:raw.v,id:itId(raw.id)||('f'+cr.toString(36)+Math.random().toString(36).slice(2,6)),pid:itId(raw.pid),created:cr,d,coach:{n:itStr(c.n,60),p:itEn(c.p).replace(/[^\d+]/g,'').slice(0,15)},a:o}};
 }catch(e){return{ok:false,err:'فایل قابل خواندن نیست'}}
}

/* text code: a safe fallback when a messenger refuses the .json file (works pasted into any chat) */
function itEncode(pack){const b=new TextEncoder().encode(JSON.stringify(pack));let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return 'GF1:'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function itDecode(text){
 const m=String(text||'').match(/GF1:([A-Za-z0-9_-]{20,})/);if(!m)return null;
 try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}catch(e){return null}
}
/* US-Navy circumference estimate of body fat %. An estimate only, never a diagnosis. */
function itBodyFat(a){
 const h=+a.height,w=+a.waist,n=+a.neck,hp=+a.hip;if(!h||!w||!n)return null;
 let bf;
 if(a.sex==='f'){if(!hp||w+hp-n<=0)return null;bf=495/(1.29579-0.35004*Math.log10(w+hp-n)+0.221*Math.log10(h))-450}
 else{if(w-n<=0)return null;bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450}
 return isFinite(bf)&&bf>2&&bf<65?Math.round(bf*10)/10:null;
}

function metrics(p){
 const w=num(p.weight),h=num(p.height),a=num(p.age);if(!w||!h||!a)return null;
 const bmi=w/Math.pow(h/100,2);
 const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
 const tdee=bmr*({'1':1.2,'2':1.375,'3':1.55,'4':1.725}[p.activity]||1.375);
 const kcal=tdee*(1+({cut:-0.2,keep:0,bulk:0.1}[p.goal]||0));
 const pr=w*(p.goal==='cut'?2.2:1.8),f=kcal*0.25/9,c=Math.max(0,(kcal-pr*4-f*9)/4);
 const whr=(num(p.waist)&&num(p.hip))?num(p.waist)/num(p.hip):null;
 return{bmi,bmr,tdee,kcal,p:pr,f,c,whr};
}
const bmiCat=b=>b<18.5?'کم‌وزن':b<25?'نرمال':b<30?'اضافه‌وزن':'چاقی';
const repsList=e=>(String(en(e.reps)).match(/\d+/g)||[]).map(Number);
const isPy=e=>e.sys==='py'||e.sys==='rpy'||e.sys==='bpy';
function nSets(e){return isPy(e)?(repsList(e).length||1):Math.max(1,num(e.sets)||1)}
function slotsOf(e,W){
 const o=[],push=(set,step,lab,cap,w,r,rest)=>o.push({set,step,lab,cap,w,r,rest});
 const n=nSets(e),RS=num(e.rest),r0=firstNum(e.reps),sys=e.sys||'st';
 const dw=f=>W?rnd(W*f):'';
 const lb=(st,i,j)=>st>1?fa(i+1)+'.'+fa(j+1):fa(i+1);
 if(sys==='py'||sys==='rpy'||sys==='bpy'){const arr=repsList(e),p=num(e.p)||10;(arr.length?arr:[8]).forEach((r,i)=>push(i,0,fa(i+1),'',sys==='bpy'?'':dw(Math.pow(1+p/100,sys==='py'?i:-i)),r,RS));return o}
 if(sys==='s21'){for(let i=0;i<n;i++)['پایین','بالا','کامل'].forEach((c,j)=>push(i,j,lb(3,i,j),c,dw(1),7,j<2?0:RS));return o}
 if(sys==='ds'){const st=1+(num(e.x)||2),p=num(e.p)||20;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),j?'دراپ':'',dw(Math.pow(1-p/100,j)),r0,j<st-1?0:RS);return o}
 if(sys==='rp'){const st=1+(num(e.x)||2),ir=num(e.ir)||15;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),j?'مینی‌ست':'',dw(1),j?'':r0,j<st-1?ir:RS);return o}
 if(sys==='cl'){const st=num(e.x)||4,ir=num(e.ir)||20;for(let i=0;i<n;i++)for(let j=0;j<st;j++)push(i,j,lb(st,i,j),'خوشه',dw(1),r0,j<st-1?ir:RS);return o}
 const k=kindOf(e),RS2=(k==='game'||k==='card')?num(e.rest)*60:RS;
 const w0=k==='str'?(W||''):(MUSK.indexOf(k)>=0?(num(e.weight)||''):(k==='card'?(num(e.dist)||''):''));
 const r=k==='dist'?num(e.dist):k==='card'?num(e.work):(k==='int'||k==='game')?num(e.work):r0;
 for(let i=0;i<n;i++)push(i,0,fa(i+1),'',w0,r,RS2);
 return o;
}
function doneSetCount(e,arr){const seen={};slotsOf(e,0).forEach((z,i)=>{if(arr&&arr[i]&&arr[i].d)seen[z.set]=1});return Object.keys(seen).length}
function dayBlocks(day){const seen={},out=[];day.ex.forEach(e=>{if(e.g){if(seen[e.g])return;seen[e.g]=1;out.push(day.ex.filter(x=>x.g===e.g))}else out.push([e])});return out}
const e1rm=(w,r)=>w*(1+Math.min(r,12)/30);
function repsT(e){const t=repsList(e);return t.length?Math.round(t.reduce((a,b)=>a+b,0)/t.length):10}
function sugg(e,wi){
 const s=S(),p=s.plan;if(!p||!e.name||kindOf(e)!=='str')return null;
 let tb=null,lb=null;const tr=(s.trial||{})[e.name];
 if(tr&&num(tr.w)>0&&num(tr.r)>0)tb={E:e1rm(num(tr.w),num(tr.r)),wb:num(tr.wk),date:tr.date||'',src:'trial',bw:num(tr.w),br:Math.min(num(tr.r),12)};
 for(let w=0;w<wi&&w<p.weeks.length;w++){
  let top=null;
  p.weeks[w].forEach((day,di)=>{const L=s.logs[w+'-'+di];if(!L)return;day.ex.forEach(x=>{if(x.name!==e.name||kindOf(x)!=='str')return;(L.sets[x.id]||[]).forEach(z=>{if(z&&z.d&&num(z.w)>0&&num(z.r)>0){const E=e1rm(num(z.w),num(z.r));if(!top||E>top.E)top={E,wb:w,date:L.date||'',src:'log',bw:num(z.w),br:Math.min(num(z.r),12)}}})})});
  if(top)lb=top;
 }
 let best=lb||tb;if(lb&&tb&&tb.date>lb.date)best=tb;
 if(!best)return null;
 const TR=repsT(e),RIR=(p.rir==null||p.rir==='')?2:num(p.rir),pct=(p.prog==null||p.prog==='')?2.5:num(p.prog);
 const W0=best.E/(1+(TR+RIR)/30),steps=Math.max(0,wi-best.wb);
 let W=W0*Math.pow(1+pct/100,steps);
 const dl=num(p.dl);let dlf=1;if(dl>1&&(wi+1)%dl===0){dlf=0.9;W*=dlf}
 return{w:rnd(W),W0,E:best.E,TR,RIR,steps,pct,dlf,src:best.src,bw:best.bw,br:best.br,wb:best.wb};
}
const effW=(e,wi)=>{if(num(e.weight))return num(e.weight);if(kindOf(e)!=='str')return 0;const g=sugg(e,wi);return g?g.w:0};
function calc(plan,logs){
 return plan.weeks.map((wk,wi)=>{
  const r={pl:{},dn:{},ton:0,dist:0,jump:0,cond:0,srpe:0,rp:[],ses:0,ps:0,ds:0};
  const add=(o,m,x)=>{if(m)o[m]=(o[m]||0)+x};
  wk.forEach((day,di)=>{
   const L=logs[wi+'-'+di];
   if(L&&L.fin){r.ses++;if(L.rpe){r.rp.push(L.rpe);r.srpe+=L.rpe*(L.min||0)}}
   day.ex.forEach(e=>{
    const k=kindOf(e),n=nSets(e),arr=(L&&L.sets[e.id])||[],mus=MUSK.indexOf(k)>=0;
    if(mus){add(r.pl,e.m,n);add(r.pl,e.s,n*.5)}
    r.ps+=n;
    arr.forEach(x=>{if(!x||!x.d)return;
     if(k==='str')r.ton+=num(x.w)*num(x.r);
     else if(k==='dist')r.dist+=num(x.r);
     else if(k==='plyo')r.jump+=num(x.r);
     else if(k==='int')r.cond+=num(x.r)/60;
     else if(k==='game')r.cond+=num(x.r);else if(k==='card')r.cond+=num(x.r);else if(k==='wod')r.cond+=wodMin(e,x)});
    const d=doneSetCount(e,arr);if(mus){add(r.dn,e.m,d);add(r.dn,e.s,d*.5)}r.ds+=d;
   });
  });
  r.rpe=r.rp.length?r.rp.reduce((a,b)=>a+b,0)/r.rp.length:null;
  return r;
 });
}
function adh(dietLog,start,meals,date){
 if(!meals.length||(start&&date<start)||date>iso())return null;
 const rec=dietLog[date];const n=rec?Object.values(rec.m||{}).filter(Boolean).length:0;
 return n/meals.length;
}
function adhWeek(dietLog,start,meals){
 const v=[];for(let i=6;i>=0;i--){v.push(adh(dietLog,start,meals,addDays(iso(),-i)))}
 const ok=v.filter(x=>x!==null);return{days:v,avg:ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null};
}

function line(series,o={}){
 const n=Math.max.apply(null,series.map(s=>s.v.length));
 const all=[].concat.apply([],series.map(s=>s.v.filter(v=>v!=null)));
 if(!all.length)return '<div class="empty sm">هنوز داده‌ای ثبت نشده</div>';
 const W=320,H=140,L=34,R=10,T=12,B=22;
 let mn=o.min!=null?o.min:Math.min.apply(null,all),mx=o.max!=null?o.max:Math.max.apply(null,all);
 if(mx===mn)mx=mn+1;
 if(o.min==null){const p=(mx-mn)*.15;mn-=p;mx+=p}
 const x=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1));
 const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const f=o.f||(v=>fnum(v));
 let g='';
 [mn,(mn+mx)/2,mx].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2C2C2C"/><text x="${L-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${f(v)}</text>`});
 for(let i=0;i<n;i+=(n>14?2:1))g+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${fa(i+1)}</text>`;
 series.forEach(s=>{
  const pts=[];s.v.forEach((v,i)=>{if(v!=null)pts.push([x(i),y(v)])});
  if(s.fill&&pts.length>1){const id='ar'+(lineSeq++);g+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".35"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs><path d="M${pts[0][0].toFixed(1)} ${H-B} ${pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')} L${pts[pts.length-1][0].toFixed(1)} ${H-B} Z" fill="url(#${id})"/>`}
  g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"${s.dash?' stroke-dasharray="4 4"':''}/>`;
  if(!s.dash)g+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${s.c}"/>`).join('');
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr">${g}</svg>`;
}
function heat(R,mode){
 const ms=MUSCLES.filter(m=>R.some(r=>(r.pl[m]||0)>0));
 if(!ms.length)return '<div class="empty sm">هنوز حرکتی در برنامه نیست</div>';
 return `<div class="scroll"><table class="heat"><tr><th></th>${R.map((_,i)=>`<th>${fa(i+1)}</th>`).join('')}</tr>${ms.map(m=>`<tr><th>${m}</th>${R.map(r=>{
  const p=r.pl[m]||0,d=r.dn[m]||0,v=mode==='plan'?p:d,a=mode==='plan'?Math.min(1,p/20):(p?Math.min(1,d/p):0);
  return `<td style="background:rgba(198,244,50,${(a*.7).toFixed(2)})">${v?fnum(v):'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`;
}

function firstOpenWeek(){const s=S();if(!s.plan)return 0;for(let w=0;w<s.plan.weeks.length;w++){for(let d=0;d<s.plan.days.length;d++){const l=s.logs[w+'-'+d];if(!(l&&l.fin))return w}}return 0}
function nextSession(){const s=S(),p=s.plan;if(!p)return null;for(let w=0;w<p.weeks.length;w++)for(let d=0;d<p.days.length;d++){const l=s.logs[w+'-'+d];if(!(l&&l.fin))return{w,d}}return null}
function sessionSets(w,d){const s=S(),day=s.plan.weeks[w][d],L=s.logs[w+'-'+d];let tot=0,dn=0;day.ex.forEach(e=>{tot+=nSets(e);dn+=doneSetCount(e,(L&&L.sets[e.id])||[])});return{tot,dn,n:day.ex.length}}
function homeData(){
 const s=S(),p=s.plan,t=iso(),dm=(s.diet&&s.diet.meals)||[],ns=nextSession();
 let trainP=0;const fin=Object.keys(s.logs).some(k=>s.logs[k]&&s.logs[k].fin&&s.logs[k].date===t);
 if(fin)trainP=1;else if(ns){const q=sessionSets(ns.w,ns.d);trainP=q.tot?q.dn/q.tot:0}else trainP=1;
 const dietP=dm.length?(adh(s.dietLog,s.start,dm,t)||0):0;
 const lw=s.weights.length?s.weights[s.weights.length-1].date:'',wtP=(lw&&lw>=addDays(t,-6))?1:0;
 const score=Math.round(1000*(.5*trainP+.35*dietP+.15*wtP));
 const rec=s.dietLog[t]||{m:{},o:{}};let k=0,pr=0;
 dm.forEach((x,i)=>{if(rec.m&&rec.m[i]){const o=(x.opts||[])[(rec.o&&rec.o[i])||0]||(x.opts||[])[0]||{};k+=num(o.kcal);pr+=num(o.p)}});
 const w=ns?ns.w:p.weeks.length-1;let wt=0,wd=0;p.days.forEach((_,di)=>{const q=sessionSets(w,di);wt+=q.tot;wd+=q.dn});
 return{ns,trainP,dietP,wtP,score,k,pr,m:metrics(curProfile()),wt,wd,w};
}

const HEAT_FULL=8;
function dayHeat(plan,logs,w,d){
 const day=plan.weeks[w]&&plan.weeks[w][d];if(!day)return null;
 const L=logs[w+'-'+d],pl={},dn={};let any=false;
 const add=(o,m,x)=>{if(m&&x)o[m]=(o[m]||0)+x};
 day.ex.forEach(e=>{
  if(MUSK.indexOf(kindOf(e))<0)return;
  const n=nSets(e),dd=doneSetCount(e,(L&&L.sets[e.id])||[]);
  add(pl,e.m,n);add(pl,e.s,n*.5);add(dn,e.m,dd);add(dn,e.s,dd*.5);if(dd>0)any=true;
 });
 const rpe=(L&&L.rpe)||0,mode=any?'done':'plan',src=any?dn:pl,press=rpe?rpe/10:.7,k=.4+.6*press;
 const sc={};let whole=0;
 Object.keys(src).forEach(m=>{const v=src[m]*k;if(m==='کل بدن')whole=Math.min(1,v/HEAT_FULL)*.45;else sc[m]=Math.min(1,v/HEAT_FULL)});
 if(whole)['سینه','پشت','شانه','جلوبازو','پشت‌بازو','ساعد','چهارسر','همسترینگ','سرینی','ساق','شکم','کمر','نزدیک‌کننده'].forEach(m=>{sc[m]=Math.max(sc[m]||0,whole)});
 return{sc,sets:src,planned:pl,mode,rpe,press,name:plan.days[d],hasMuscle:Object.keys(pl).length>0};
}

 (Array.isArray(f.pays)?f.pays:[]).slice(0,120).forEach(p=>{if(p&&Number(p.amt)>0)o.pays.push({id:itId(p.id)||uid(),date:dOk(p.date)||iso(),amt:Math.round(Number(p.amt)),note:itStr(p.note,60)})});

 b.codes=(Array.isArray(b.codes)?b.codes:[]).slice(0,60).map(c=>c&&typeof c==='object'?{id:itId(c.id)||uid(),code:itStr(c.code,24).toUpperCase().replace(/\s+/g,''),type:c.type==='a'?'a':'p',val:Math.max(0,Number(c.val)||0),exp:dOk(c.exp),max:Math.max(0,parseInt(c.max,10)||0),used:Math.max(0,parseInt(c.used,10)||0)}:null).filter(c=>c&&c.code);
 DB.biz=b;
 DB.templates=(Array.isArray(DB.templates)?DB.templates:[]).filter(t=>t&&t.plan&&Array.isArray(t.plan.weeks)).slice(0,40);
 (DB.clients||[]).forEach(c=>{

const finOf=c=>c.fin||(c.fin=normFin({}));
function finCalc(c){
 const f=c&&c.fin;if(!f)return null;
 const base=f.base;let d=f.dt==='a'?f.dv:base*Math.min(100,f.dv)/100;d=Math.round(Math.min(base,Math.max(0,d)));
 const fin=base-d,paid=f.pays.reduce((a,p)=>a+p.amt,0),due=Math.max(0,fin-paid),extra=Math.max(0,paid-fin);
 const st=(!base&&!paid)?'none':(due===0?'paid':paid>0?'part':'unpaid');
 const dl=f.end?Math.ceil((new Date(f.end+'T12:00:00')-new Date(iso()+'T12:00:00'))/864e5):null;
 return{base,disc:d,final:fin,paid,due,extra,st,dl};
}

function applyCode(f,cd){

 if(f.code!==cd.code)cd.used++;

function validPlanFile(d){

function exDetail(e){
 const k=kindOf(e),sy=SYS[e.sys]||SYS.st,KD=KIND[k]||KIND.str,p=[];
 if(k==='wod'){
  ensureWod(e);const W=e.wod;p.push(sy.n);
  if(num(W.cap))p.push(((e.sys==='wamrap'||e.sys==='wemom')?'مدت ':'سقف ')+fa(num(W.cap))+' دقیقه');
  if(num(W.rounds))p.push(fa(num(W.rounds))+' دور');if(W.scheme)p.push(en(W.scheme));if(num(W.rest))p.push('استراحت '+fa(num(W.rest))+' ث');
  const mv=W.mv.filter(m=>m.n).map(m=>'   • '+(m.r?m.r+' ':'')+m.n+(m.w?' ('+m.w+')':''));
  return p.join(' · ')+(mv.length?'\n'+mv.join('\n'):'')+(W.sc?'\n   Scaled: '+W.sc:'');
 }
 if(k==='str'||k==='bw'){
  p.push((isPy(e)?fa(nSets(e)):fa(num(e.sets)||1))+' ست × '+en(e.reps||'—'));
  if(e.tempo)p.push('تمپو '+en(e.tempo));
  if(num(e.weight))p.push(k==='str'?'وزنه '+fa(num(e.weight))+' kg':'سطح '+fa(num(e.weight)));
  if(num(e.rest))p.push('استراحت '+fa(e.rest)+' ث');
 }else KD.f.forEach(([f,l])=>{const v=e[f];if(v===''||v==null||(f==='rest'&&!num(v)))return;p.push(l+' '+fa(v))});
 (sy.x||[]).forEach(([f,l])=>{if(num(e[f])>0)p.push(l+' '+fa(e[f]))});
 return p.join(' · ');
}
function sesText(cl,s){
 const L=['📋 '+(cl.name||'کلاس')+' — '+(s.title||'جلسه')];
 const meta=[];if(s.date)meta.push('📅 '+jdate(s.date));if(s.dur)meta.push('⏱ '+fa(s.dur)+' دقیقه');if(s.focus)meta.push('🎯 '+s.focus);
 if(meta.length)L.push(meta.join('   '));if(s.equip)L.push('🧰 تجهیزات: '+s.equip);
 BLK.forEach(b=>{
  const list=s.ex.filter(e=>(e.blk||'بدنه اصلی')===b);if(!list.length)return;
  L.push('','— '+b+' —');let n=0;
  dayBlocks({ex:list}).forEach(m=>{
   if(m.length>1||m[0].g){const sy=SYS[m[0].sys]||SYS.st;L.push(sy.n+' (گروه '+m[0].g+')');m.forEach(e=>{L.push('   • '+(e.name||'حرکت')+(exDetail(e)?' — '+exDetail(e):''))})}
   else{n++;const e=m[0],d=exDetail(e);L.push(fa(n)+') '+(e.name||'حرکت')+(d?' — '+d:''))}
  });
 });
 if(s.note)L.push('','📝 '+s.note);
 return L.join('\n');
}

function lvExpand(p){
 const segs=[];let t=0;
 const add=(k,sec,o)=>{segs.push(Object.assign({k,sec,s:t},o||{}));t+=sec};
 const stn=p.st;
 if(p.prep>0)add('prep',p.prep,{n:'آماده شو',nx:(stn[0]||{}).n||'',i:0,r:1,tot:p.rounds});
 if(p.mode==='int'){
  for(let r=1;r<=p.rounds;r++){
   stn.forEach((s,i)=>{
    const lastAll=r===p.rounds&&i===stn.length-1;
    if(s.w>0)add('work',s.w,{n:s.n,i,r,tot:p.rounds,reps:s.reps,cue:s.cue,nx:stn[i+1]?stn[i+1].n:(r<p.rounds?stn[0].n:'')});
    if(!lastAll){
     const endR=i===stn.length-1;
     if(endR&&p.restRound>0)add('rr',p.restRound,{n:'استراحت بین دورها',i,r,tot:p.rounds,nx:stn[0].n});
     else if(s.r>0)add('rest',s.r,{n:'استراحت',i,r,tot:p.rounds,nx:endR?stn[0].n:stn[i+1].n});
    }
   });
  }
 }else{
  const sec=p.cap>0?p.cap*60:(p.mode==='ft'?7200:600);
  add('work',sec,{n:p.name,i:0,r:1,tot:1,all:true});
 }
 segs.push({k:'done',sec:0,s:t,n:'تمام شد'});
 return{segs,total:t};
}

function lvBeep(c,out,t,f,d,v,type){
 const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+Math.max(.02,d-.04));g.gain.linearRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);
}
function lvHorn(c,out,t,d){
 const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.8,t+.015);g.gain.setValueAtTime(.8,t+d-.08);g.gain.linearRampToValueAtTime(0.0001,t+d);
 [[392,'square'],[396,'square'],[784,'sawtooth']].forEach(([f,ty],i)=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=f;og.gain.value=i===2?.18:.42;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.05)});
 g.connect(lp);lp.connect(out);
}
/* schedule every sound of the timeline relative to LV.base (audio-clock seconds) */
function lvSchedule(from){
 const c=LV.c,sn=lvSnd();if(!c)return;
 if(LV.master){try{LV.master.disconnect()}catch(e){}}
 const m=c.createGain();m.gain.value=sn.on?sn.vol:0;m.connect(c.destination);LV.master=m;
 const horn=sn.mode==='horn',now=c.currentTime;
 const at=(rel,fn)=>{const t=LV.base+rel;if(t>=now-.02&&rel>=from-.001)fn(Math.max(t,now+.005))};
 LV.segs.forEach(s=>{
  if(s.k==='done'){at(s.s,t=>{if(horn){lvHorn(c,m,t,1.2);lvHorn(c,m,t+1.5,1.2)}else{[0,.3,.6].forEach(o=>lvBeep(c,m,t+o,988,.22,.9))}});return}
  if(s.k==='work')at(s.s,t=>horn?lvHorn(c,m,t,s.sec>=120?1.2:.7):lvBeep(c,m,t,988,.5,.9));
  else if(s.k==='rest'||s.k==='rr')at(s.s,t=>lvBeep(c,m,t,horn?523:587,.35,.8));
  else if(s.k==='prep')at(s.s,t=>lvBeep(c,m,t,659,.2,.6));
  if(s.sec>=4)[3,2,1].forEach(k=>at(s.s+s.sec-k,t=>lvBeep(c,m,t,k===1?880:784,.14,.85)));
  if(s.k==='work'&&s.sec>=90)at(s.s+s.sec-10,t=>lvBeep(c,m,t,880,.3,.85));
  if(s.k==='work'&&s.sec>=150)at(s.s+s.sec-60,t=>{lvBeep(c,m,t,740,.15,.8);lvBeep(c,m,t+.25,740,.15,.8)});
 });
}

 }

 if(s.k==='done'){tEl.textContent=LV.p.mode==='ft'&&LV.ftDone?lvFmt(LV.ftDone):'00:00';document.getElementById('lvpg').style.width='100%';return}

}

function wodToProg(e){

 const base={name:e.name||'WOD',cls:'',prep:10,st:mv.length?mv:[{n:e.name||'WOD',reps:''}]};
 if(sy==='wamrap')return cleanLive(Object.assign(base,{mode:'amrap',cap:cap||12}));
 if(sy==='wemom'){const n=cap||10,st=[];for(let i=0;i<n;i++){const m=base.st[i%base.st.length];st.push({n:m.n,w:60,r:0,reps:m.reps})}return cleanLive(Object.assign(base,{mode:'int',rounds:1,st}))}
 if(sy==='wtab'){return cleanLive(Object.assign(base,{mode:'int',rounds:Math.max(1,Math.round(8/base.st.length)),restRound:0,st:base.st.map(m=>({n:m.n,w:20,r:10,reps:m.reps}))}))}
 if(sy==='wint'){return cleanLive(Object.assign(base,{mode:'int',rounds:num(W.rounds)||3,restRound:num(W.rest)||60,st:base.st.map(m=>({n:m.n,w:60,r:0,reps:m.reps}))}))}
 if(sy==='wrft'){const n=Math.max(1,Math.min(10,num(W.rounds)||3)),st=[];for(let i=0;i<n;i++)base.st.forEach(m=>st.push({n:m.n+(n>1?' (دور '+fa(i+1)+')':''),reps:m.reps}));return cleanLive(Object.assign(base,{mode:'ft',cap:cap||20,st}))}
 return cleanLive(Object.assign(base,{mode:'ft',cap:cap||15}));
}

function shBell(){
 const o=[];
 if(DB.role==='coach'){
  const P=(DB.pending||[]).length;if(P)o.push([fa(P)+' فرم شاگرد در انتظار',"go({screen:null,cid:null})"]);
  const nr=DB.clients.filter(c=>c.logs).length;if(nr)o.push([fa(nr)+' گزارش شاگرد',"go({screen:null,cid:null,fst:'new'})"]);
  if(DB.clients.length&&typeof biz==='function'&&(!biz().lastBackup||Date.now()-biz().lastBackup>7*864e5))o.push(['پشتیبان‌گیری را فراموش نکن',"A.backup()"]);
 }else{
  const s=S();if(s.plan){const ns=nextSession();if(ns)o.push(['جلسهٔ بعدی: '+s.plan.days[ns.d],`go({screen:null,sTab:'train',w:${ns.w},d:${ns.d}})`]);}
  if(s.sub&&s.sub.e){const dl=Math.ceil((new Date(s.sub.e+'T12:00:00')-new Date(iso()+'T12:00:00'))/864e5);if(dl<=14)o.push([dl<0?'اشتراکت تمام شده':'اشتراکت '+fa(dl)+' روز دیگر تمام می‌شود',"go({screen:null,sTab:'me',meSub:'more'})"])}
  if((s.live||[]).length)o.push([fa(s.live.length)+' برنامهٔ تمرین زنده',"go({screen:'live'})"]);
 }
 return o;
}

  (typeof SPORTS==='object'?Object.keys(SPORTS):[]).forEach(k=>{if(has(SPORTS[k].n))add(SPORTS[k].n,'رشته',"go({screen:'sports'})")});
 }else{

A.unlock=()=>{
 if(Date.now()<UI.lockUntil)return toast('چند ثانیه صبر کن و دوباره امتحان کن');
 const p=pinDigits($('#pin').value);
 if(DB.pin){
  if(hp(p)===DB.pin){UI.unlocked=true;UI.fails=0;go({});return}
  UI.fails++;if(UI.fails>=5){UI.lockUntil=Date.now()+30000;UI.fails=0;return toast('۵ بار اشتباه؛ ۳۰ ثانیه صبر کن')}
  return toast('رمز اشتباه است');
 }
 if(p.length<4)return toast('رمز باید حداقل ۴ رقم باشد');
 if(p!==pinDigits($('#pin2').value))return toast('تکرار رمز یکی نیست');
 if(S().plan)return toast('این گوشی در حالت شاگرد است');
 DB.pin=hp(p);save();UI.unlocked=true;go({});
};

 L.fin=true;L.min=L.start?Math.max(1,Math.round((Date.now()-L.start)/60000)):0;L.date=iso();save();render();toast('تمرین ثبت شد');
};
A.shift=n=>{const d=addDays(UI.date,n);if(d>iso())return;UI.date=d;render()};
const dayRec=()=>{const L=S().dietLog;const r=L[UI.date]=L[UI.date]||{m:{},c:{},o:{}};if(!r.o)r.o={};return r};
A.pickOpt=(i,j)=>{const r=dayRec();r.o[i]=+j;save();render()};
A.tickMeal=i=>{const r=dayRec();r.m[i]=!r.m[i];save();render()};
A.tickCorr=i=>{const L=S().dietLog;const r=L[iso()]=L[iso()]||{m:{},c:{}};r.c[i]=!r.c[i];save();render()};
A.addW=()=>{const v=num($('#wt').value);if(!v)return toast('وزن را وارد کن');const s=S(),d=iso(),wa=num($('#wa').value)||'';s.weights=s.weights.filter(x=>x.date!==d);s.weights.push({date:d,w:v,waist:wa});s.weights.sort((a,b)=>a.date<b.date?-1:1);save();render();toast('وزن ثبت شد')};
const logPack=()=>{const s=S(),p=s.profile||{};return{pack:{app:'fitplan',kind:'log',v:1,cid:s.cid,planId:s.plan.id,name:p.name,exported:Date.now(),start:s.start,logs:s.logs,weights:s.weights,dietLog:s.dietLog},file:'growfit-report-'+(p.name||'student').replace(/\s+/g,'_')+'-'+iso()+'.json',title:'گزارش '+(p.name||'')}};
A.sendLog=()=>{const x=logPack();shareFile(x.pack,x.file,x.title)};
A.dlLog=()=>{const x=logPack();dl(x.pack,x.file);toast('فایل گزارش دانلود شد')};

/* ================= init ================= */
$('#lib').innerHTML=LIB.map(l=>`<option value="${esc(l[0])}">`).join('');
normDB();
if(DB.role==='student')UI.w=firstOpenWeek();
render(false);
if(typeof window!=='undefined'){
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(UI.screen==='settings'||(DB.role==='student'&&UI.sTab==='me'))render()});
 window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('برنامه نصب شد');render()});
 window.addEventListener('afterprint',()=>{const r=$('#printroot');if(r)r.innerHTML=''});
}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
